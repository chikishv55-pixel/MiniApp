<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Меткий Джо</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html,body{height:100%;background:#05060c;overflow:hidden;touch-action:none;color:#fff;
  font-family:"Arial Black","Segoe UI Black","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:900}
#stage{position:absolute;left:50%;top:50%;width:540px;height:960px;transform-origin:center;overflow:hidden;background:#000}
#c{position:absolute;left:0;top:0;width:540px;height:960px;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

#hud{position:absolute;left:0;right:0;top:0;padding:20px 22px;pointer-events:none}
#hudrow{display:flex;justify-content:space-between;align-items:center;height:44px}
#bHome{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:3px solid rgba(255,255,255,.55);font-size:20px;line-height:36px}
#coins{display:flex;align-items:center;gap:10px;font-size:34px;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.coin{width:28px;height:28px;border-radius:50%;display:inline-block;flex:none;
  background:radial-gradient(circle at 35% 35%,#fff1a8,#ffc233 55%,#d98a00);box-shadow:inset 0 0 0 3px #ffd95a,0 2px 0 #8a5600}
#lvl{position:relative;height:30px;width:270px;margin:10px auto 0;border-radius:15px;background:rgba(255,255,255,.18);overflow:hidden}
#lvlfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff4d6d,#ff9a3d);transition:width .35s}
#lvltxt{position:relative;display:block;text-align:center;line-height:30px;font-size:17px}
#boss{margin:12px auto 0;width:330px;text-align:center;font-size:15px;letter-spacing:1px;color:#ffd0d6}
#bossbar{height:14px;border-radius:7px;background:rgba(0,0,0,.45);margin-top:5px;overflow:hidden;border:2px solid rgba(255,255,255,.35)}
#bossfill{height:100%;width:100%;background:#ff3355;transition:width .2s}

#title{position:absolute;left:0;right:0;top:150px;text-align:center;pointer-events:none;transform:rotate(-4deg)}
#title .l1{font-size:58px;letter-spacing:6px;line-height:1;text-shadow:0 5px 0 rgba(0,0,0,.4)}
#title .l2{font-size:132px;line-height:1;color:#ffc233;text-shadow:0 7px 0 #a45f00,0 14px 0 rgba(0,0,0,.35);letter-spacing:4px}
#title .l2 i{font-style:normal;position:relative}
#title .l2 i:after{content:"";position:absolute;left:50%;top:54%;width:22px;height:22px;margin:-11px;border-radius:50%;background:#0b0d18;box-shadow:0 0 0 4px #a45f00}
#hint{position:absolute;left:0;right:0;top:470px;text-align:center;font-size:21px;letter-spacing:1px;pointer-events:none;animation:pulse 1.1s ease-in-out infinite}
#best{position:absolute;left:0;right:0;top:505px;text-align:center;font-size:14px;opacity:.6;pointer-events:none;font-family:"Segoe UI",system-ui,sans-serif;font-weight:700}
@keyframes pulse{50%{opacity:.35;transform:scale(.96)}}

#menu{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;gap:18px}
.mb{width:112px;height:112px;border-radius:22px;border:4px solid rgba(255,255,255,.9);background:rgba(4,10,24,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;letter-spacing:.5px;transition:transform .08s}
.mb:active{transform:scale(.93)}
.mb canvas{width:84px;height:60px}
.col{display:flex;flex-direction:column;gap:12px}
.mb.half{height:50px;width:96px;border-radius:14px;font-size:24px}
.mb.off{opacity:.35;text-decoration:line-through}

#shop{position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(#0a1024,#0d1a2e);display:flex;flex-direction:column;padding:20px 22px}
#shophead{display:flex;align-items:center;justify-content:space-between;height:48px}
#bBack{width:48px;height:48px;border-radius:14px;border:3px solid rgba(255,255,255,.7);font-size:26px;line-height:38px}
#shoptitle{font-size:24px;letter-spacing:2px}
#shopcoins{display:flex;align-items:center;gap:8px;font-size:24px}
#prev{width:496px;height:170px;margin-top:8px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px}
.card{height:196px;border-radius:22px;border:5px solid #56607a;background:rgba(3,8,18,.55);display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;padding:12px 4px 10px;transition:transform .08s}
.card:active{transform:scale(.95)}
.card b{font-size:15px;line-height:1.1;height:34px;display:flex;align-items:center;text-align:center}
.card canvas{width:140px;height:86px}
.card small{font-size:14px;display:flex;align-items:center;gap:5px;height:22px;font-family:"Segoe UI",system-ui,sans-serif;font-weight:800}
.card small .coin{width:16px;height:16px;box-shadow:inset 0 0 0 2px #ffd95a}
.card.own{border-color:#c9d2e6}
.card.sel{background:#ffc233;border-color:#ffc233;color:#231700}
.card.lock b{color:#aeb7cc}
.card.no small{color:#ff7a8c}
.card.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
#stat{margin-top:12px;text-align:center;font-size:14px;opacity:.75;min-height:20px;font-family:"Segoe UI",system-ui,sans-serif;font-weight:700}

#over{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(5,6,14,.72);display:flex;align-items:center;justify-content:center}
#over .box{width:400px;border-radius:28px;background:#101830;border:4px solid rgba(255,255,255,.15);padding:30px 28px;text-align:center}
#over h2{font-size:44px;color:#ff4d6d;letter-spacing:2px}
#over p{margin:12px 0 22px;font-size:17px;line-height:1.5;font-family:"Segoe UI",system-ui,sans-serif;font-weight:700;color:#cdd5ea}
#over p b{color:#ffc233}
.big{display:block;width:100%;height:66px;border-radius:18px;background:#ffc233;color:#231700;font-size:24px;letter-spacing:1px;box-shadow:0 6px 0 #a45f00;margin-bottom:18px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a45f00}
.big.chal{background:#ff3d9a;color:#1a0010;box-shadow:0 6px 0 #9a1f5c}
.big.chal:active{box-shadow:0 2px 0 #9a1f5c}
#best.ch{opacity:1;color:#ff3d9a;font-size:17px;font-family:inherit;font-weight:900;letter-spacing:1px}
.ghost{display:block;width:100%;height:52px;border-radius:16px;border:3px solid rgba(255,255,255,.5);font-size:18px}
#toast{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);background:#ff4d6d;padding:10px 22px;border-radius:14px;font-size:16px;white-space:nowrap;
  opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="540" height="960"></canvas>

  <div id="hud">
    <div id="hudrow">
      <button id="bHome" hidden aria-label="В меню">&#10005;</button><span></span>
      <div id="coins"><i class="coin"></i><span id="coinv">0</span></div>
    </div>
    <div id="lvl"><div id="lvlfill"></div><span id="lvltxt">Уровень 1</span></div>
    <div id="boss" hidden><span id="bossname"></span><div id="bossbar"><div id="bossfill"></div></div></div>
  </div>

  <div id="title"><div class="l1">МЕТКИЙ</div><div class="l2">ДЖ<i>О</i></div></div>
  <div id="hint">НАЖМИ, ЧТОБЫ НАЧАТЬ</div>
  <div id="best"></div>

  <div id="menu">
    <div class="col">
      <button id="bMus" class="mb half" aria-label="Музыка">&#9834;</button>
      <button id="bSnd" class="mb half" aria-label="Звук">&#9668;))</button>
    </div>
    <button id="bSkin" class="mb"><canvas width="168" height="120"></canvas>СКИНЫ</button>
    <button id="bGun" class="mb"><canvas width="168" height="120"></canvas>ОРУЖИЕ</button>
  </div>

  <div id="shop" hidden>
    <div id="shophead">
      <button id="bBack" aria-label="Назад">&#8249;</button>
      <div id="shoptitle">ОРУЖИЕ</div>
      <div id="shopcoins"><i class="coin"></i><span id="shopcoinv">0</span></div>
    </div>
    <canvas id="prev" width="992" height="340"></canvas>
    <div id="grid"></div>
    <div id="stat"></div>
  </div>

  <div id="over" hidden>
    <div class="box">
      <h2 id="ovh">ПРОМАХ!</h2>
      <p id="ovtxt"></p>
      <button id="bChal" class="big chal" hidden>&#9876; ВЫЗОВ ДРУГУ</button>
      <button id="bRetry" class="big">ЕЩЁ РАЗ</button>
      <button id="bMenu" class="ghost">В МЕНЮ</button>
    </div>
  </div>
  <div id="toast"></div>
</div>

<script src="look.js"></script>
<script>
'use strict';
/* ================= БАЗА ================= */
const W=540,H=960,SH=22,NS=5,PH=SH*NS,FLAT=290,SW=20,DEG=Math.PI/180;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const css=c=>'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
const hsh=i=>{const x=Math.sin(i*127.1+11.7)*43758.5453;return x-Math.floor(x);};

/* ================= СОХРАНЕНИЕ ================= */
const KEY='metkiy-joe-v1';
let S={coins:0,level:1,ownW:[0],ownS:[0],curW:0,curS:0,snd:1,mus:1,best:0};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&typeof r==='object'&&Array.isArray(r.ownW)&&Array.isArray(r.ownS))S=Object.assign(S,r);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(CH?Object.assign({},S,{level:careerLevel}):S));}catch(e){}}

/* ================= ВСТРАИВАНИЕ В PIXEL ARENA ================= */
// ?embed=1 — игра открыта внутри мини-аппа; ?mode=challenge&seed=&level=&target=&from= — вызов от друга
const QS=new URLSearchParams(location.search);
const EMBED=QS.get('embed')==='1'&&window.parent!==window;
const CH=QS.get('mode')==='challenge';
const RUN={
  seed:(Number(QS.get('seed'))>>>0),
  level0:clamp(parseInt(QS.get('level'),10)||1,1,999),
  target:clamp(parseInt(QS.get('target'),10)||0,0,100000),
  from:(QS.get('from')||'').slice(0,12)
};
const careerLevel=S.level; // в режиме вызова карьерный уровень не трогаем
if(CH)S.level=RUN.level0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function post(m){if(EMBED)try{window.parent.postMessage(Object.assign({src:'joe'},m),location.origin);}catch(e){}}

// Детерминированный рандом: одинаковый сид = одинаковые враги у обоих игроков.
// Каждый враг считается от (сид, площадка, ...), а не от общей цепочки, поэтому
// разная игра (промахи, оружие) не сдвигает следующих врагов.
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rngFor(){let h=(RUN.seed^0x2545F491)|0;for(let i=0;i<arguments.length;i++){h=Math.imul(h^(arguments[i]|0),0x9E3779B1);h^=h>>>15;}return mulberry(h);}
let shotR=Math.random,advN=0;

/* ================= ДАННЫЕ ================= */
const WEAPONS=[
 {n:'Тихоня',   price:0,   dmg:1,  len:32, info:'Урон 1 · бесшумный'},
 {n:'Орёл',     price:80,  dmg:2,  len:27, info:'Урон 2'},
 {n:'Магнум',   price:200, dmg:3,  len:30, info:'Урон 3'},
 {n:'АКМ',      price:400, dmg:1,  len:48, burst:3, spread:2.2, info:'Очередь ×3'},
 {n:'АУГ',      price:650, dmg:1.5,len:38, burst:4, spread:1.4, info:'Очередь ×4 · кучно'},
 {n:'ЭВО-3',    price:900, dmg:1,  len:32, burst:6, spread:3.6, info:'Очередь ×6'},
 {n:'Дробовик', price:1200,dmg:1.5,len:52, pellets:6, spread:9, info:'6 дробин веером'},
 {n:'Скаут',    price:1600,dmg:8,  len:66, laser:1, info:'Урон 8 · лазерный прицел'},
 {n:'Пулемёт',  price:2200,dmg:1.5,len:58, burst:10,spread:3, info:'Очередь ×10'}
];
const SKINS=[
 {n:'Обычный',price:0},{n:'Агент',price:60},{n:'Камуфляж',price:120},
 {n:'Ковбой',price:200},{n:'Ниндзя',price:300},{n:'Командос',price:400},
 {n:'Бегун',price:550},{n:'Снайпер',price:700},{n:'Панк',price:900}
];
const PALS=[['#120b3a','#6f5cff'],['#04222b','#1fb6c9'],['#2b0d1c','#ff6b5e'],['#062a22','#2fd08c'],
            ['#2a1206','#ffa531'],['#1f0a2c','#ff4fc3'],['#0d1626','#7f9cc9']].map(p=>[hex(p[0]),hex(p[1])]);
const BOSSES=['Большой Бо','Барон Гром','Мадам Кобра','Железный Зуб','Капитан Шрам'];
const ECOL=['#ff4d6d','#35d6c9','#b06bff','#ff9a3d','#4fd66b','#5aa2ff','#ff6fd0'];

/* ================= РИСОВАНИЕ: ПРИМИТИВЫ ================= */
let SIL=null; // цвет силуэта (для закрытых предметов и вспышки попадания)
function box(c,col,x,y,w,h,r){
  c.fillStyle=SIL||col;
  if(!r){c.fillRect(x,y,w,h);return;}
  c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fill();
}
function poly(c,col,p){c.fillStyle=SIL||col;c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();c.fill();}
function disc(c,col,x,y,r){c.fillStyle=SIL||col;c.beginPath();c.arc(x,y,r,0,7);c.fill();}

/* ================= РИСОВАНИЕ: ОРУЖИЕ (ствол смотрит вправо, 0,0 — рука) ================= */
function drawGun(c,id){
  const st='#2f3850',dk='#141926',lt='#93a0bd',wd='#a8642e',ol='#5b6b47';
  switch(id){
  case 0: box(c,st,-2,-8,20,7,1);box(c,lt,1,-8,11,2);box(c,dk,18,-7,15,5,2);box(c,dk,-2,-1,7,10,1);box(c,dk,6,-1,5,3);break;
  case 1: box(c,lt,-3,-10,29,7,1);box(c,st,-3,-4,29,3);box(c,dk,24,-8,2,3);box(c,dk,-3,-1,9,12,2);box(c,dk,8,-1,6,3);box(c,dk,4,-10,8,2);break;
  case 2: box(c,lt,7,-9,24,5,1);box(c,st,9,-4,13,2);box(c,st,-3,-11,12,10,3);box(c,dk,0,-8,6,4,1);box(c,wd,-7,-3,8,13,3);box(c,dk,-6,-12,3,3);box(c,dk,5,-1,5,3);break;
  case 3: box(c,wd,-23,-7,17,8,2);box(c,st,-7,-9,25,8,1);box(c,wd,18,-8,14,6,1);box(c,dk,18,-10,12,2);box(c,dk,32,-7,17,3);box(c,dk,45,-11,2,4);
          box(c,dk,8,-1,7,8);box(c,dk,10,6,7,6,2);box(c,wd,-3,-1,6,10,2);break;
  case 4: box(c,ol,-24,-9,36,10,3);box(c,ol,-24,-3,9,10,2);box(c,dk,12,-7,27,3);box(c,dk,36,-8,3,5);box(c,dk,-6,-15,18,4,2);box(c,dk,-3,-11,3,2);box(c,dk,7,-11,3,2);
          box(c,ol,15,-4,5,11,2);box(c,dk,-14,1,7,11,1);box(c,ol,-3,-1,6,10,2);break;
  case 5: box(c,st,-8,-10,30,9,2);box(c,lt,-5,-12,21,2);box(c,dk,22,-8,11,4,1);box(c,dk,-21,-9,13,3);box(c,dk,-21,-9,3,10);box(c,dk,6,-1,6,15,1);box(c,dk,-3,-1,6,10,2);box(c,dk,15,-1,4,5);break;
  case 6: box(c,wd,-23,-6,19,9,3);box(c,st,-5,-9,17,8,1);box(c,lt,12,-9,41,3);box(c,dk,12,-5,35,3);box(c,wd,22,-6,15,6,2);box(c,dk,2,-1,5,3);box(c,dk,51,-11,2,3);break;
  case 7: box(c,'#3f4d3c',-25,-7,21,9,3);box(c,'#3f4d3c',-5,-8,25,7,1);box(c,dk,20,-7,44,3);box(c,dk,62,-8,5,5,1);box(c,dk,-1,-15,25,5,2);box(c,'#6fd3ff',22,-15,2,5);
          box(c,dk,4,-10,3,2);box(c,dk,17,-10,3,2);box(c,dk,8,-1,6,6);box(c,'#3f4d3c',-3,-1,6,9,2);break;
  case 8: box(c,dk,-25,-8,15,9,2);box(c,st,-11,-11,31,11,2);box(c,dk,20,-8,38,4);box(c,lt,20,-9,17,2);box(c,dk,56,-9,3,6);box(c,dk,6,-15,13,2);box(c,dk,8,-13,2,3);box(c,dk,15,-13,2,3);
          box(c,ol,0,0,15,12,2);box(c,'#e0ac33',3,-2,10,2);box(c,dk,-7,0,6,9,2);box(c,dk,44,-4,2,11);break;
  }
}

/* ================= РИСОВАНИЕ: ПЕРСОНАЖИ (0,0 — ступни, смотрит вправо) ================= */
function base(c,body,head){box(c,body,-13,-32,26,32,4);box(c,head,-15,-62,32,31,7);}
function eyes(c,col){box(c,col||'#1b1b28',6,-51,4,7,1);box(c,col||'#1b1b28',12,-51,4,7,1);}
function drawSkin(c,id){
  switch(id){
  case 0: base(c,'#ffc233','#ffffff');eyes(c);break;
  case 1: base(c,'#1c2236','#ffffff');box(c,'#fff',2,-32,9,15);box(c,'#e5334b',5,-31,3,13);box(c,'#22262f',-15,-62,30,7,4);box(c,'#111',2,-53,16,6,2);break;
  case 2: base(c,'#5f7d3b','#ecdcc0');box(c,'#3f5a28',-10,-26,9,7,3);box(c,'#3f5a28',2,-14,9,8,3);box(c,'#7d9a4b',-4,-9,7,5,2);
          box(c,'#4c6a30',-17,-65,35,13,6);box(c,'#3a5424',-10,-63,9,5,2);box(c,'#7d9a4b',5,-62,8,4,2);eyes(c);break;
  case 3: base(c,'#c98a4b','#ffe6cb');box(c,'#7a4a22',-13,-32,9,32,3);box(c,'#d6334a',-11,-37,24,7,3);eyes(c);
          box(c,'#6b3f1d',-25,-65,50,5,2);box(c,'#6b3f1d',-12,-78,25,15,5);box(c,'#e9b23a',-12,-69,25,3);break;
  case 4: base(c,'#232a3d','#232a3d');box(c,'#d6334a',-13,-15,26,4);box(c,'#ffe1c4',1,-54,16,9,2);eyes(c);
          box(c,'#d6334a',-15,-60,32,4);box(c,'#d6334a',-25,-60,10,3);box(c,'#d6334a',-27,-55,10,3);break;
  case 5: base(c,'#4c5f3b','#f0d2b0');poly(c,'#2b3323',[-13,-32,-7,-32,13,-8,13,-2]);box(c,'#e0ac33',-4,-24,3,4);box(c,'#e0ac33',3,-16,3,4);
          box(c,'#c2283a',-17,-67,31,10,5);box(c,'#c2283a',-21,-63,9,6,3);eyes(c);box(c,'#333',4,-42,11,2);break;
  case 6: base(c,'#2f7de1','#ffffff');box(c,'#fff',-13,-23,26,4);box(c,'#fff',-13,-17,26,2);box(c,'#ff4d6d',-15,-59,32,5);eyes(c);box(c,'#1b1b28',-17,-10,4,6,1);break;

/* ================= МИР: ЛЕСТНИЦА ================= */
const platY=k=>-k*PH;
const platX=k=>k%2===0?140:W-140;
const facing=k=>k%2===0?1:-1;
function surf(i,x){const xx=(i&1)?W-x:x;const n=xx<FLAT?0:Math.min(NS,Math.floor((xx-FLAT)/SW)+1);return platY(i)-n*SH;}

/* ================= СОСТОЯНИЕ ИГРЫ ================= */
let state='menu',kills=0,need=4,combo=0,runCoins=0,runKills=0;
let player=null,enemy=null,corpses=[],bullets=[],parts=[],texts=[],timers=[];
let aim=0,aimDir=1,aimMax=1,aimSpeed=1,aimTarget=0,shot=null,adv=null,banner=null;
let camY=0,shake=0,slow=0,time=0,flashT=0;
let pal=[PALS[(S.level-1)%PALS.length][0].slice(),PALS[(S.level-1)%PALS.length][1].slice()];
const levelNeed=L=>3+Math.min(L,7);
const after=(t,fn)=>timers.push({t,fn});

function resetWorld(){
  if(CH)S.level=RUN.level0;
  player={k:0,x:platX(0),y:platY(0),dir:1,kick:0,dead:false,s:1};
  enemy=null;corpses=[];bullets=[];parts=[];texts=[];timers=[];shot=null;adv=null;banner=null;
  kills=0;need=levelNeed(S.level);combo=0;runCoins=0;runKills=0;camY=player.y-640;shake=0;slow=0;
}
function makeEnemy(m,boss){
  const L=S.level,r=rngFor(m,boss?1:0,L),R=(a,b)=>a+r()*(b-a),xx=R(95,150),tx=m%2===0?xx:W-xx;
  const e={k:m,x:m%2===0?-60:W+60,sx:0,tx,y:platY(m),dir:facing(m),alive:true,boss,flash:0,aim:0,kick:0,t:0,
    col:ECOL[Math.floor(r()*ECOL.length)],col2:'#22283a',hat:Math.floor(r()*4),armor:false,s:1,hp:1,gun:0,btype:0,name:''};
  e.sx=e.x;
  if(boss){e.s=1.55;e.hp=3+Math.min(L,12)*2;e.btype=(L-1)%5;e.name=BOSSES[(L-1)%BOSSES.length];e.gun=[6,2,5,8,1][e.btype];}
  else{
    e.s=L<2?R(1,1.2):R(Math.max(.8,1.05-L*.03),1.25);
    e.armor=L>=3&&r()<.25;if(e.armor)e.hp=2;
    e.gun=[0,0,1,2,5,3][Math.min(5,Math.floor(r()*(1+L/2)))];
  }
  e.max=e.hp;return e;
}
function spawnEnemy(){enemy=makeEnemy(player.k+1,kills>=need);state='spawn';if(enemy.boss){sfx('boss');addText(W/2,camY+330,'БОСС!','#ff4d6d',44);}}
function gunPoint(a,ang,len){ // дуло в мировых координатах
  const s=a.s||1;return {x:a.x+a.dir*s*(6+len*Math.cos(ang)-5*Math.sin(ang)),y:a.y+s*(-22-len*Math.sin(ang)-5*Math.cos(ang))};
}
function setupAim(){
  const e=enemy,py=player.y-22,hy=e.y-47*e.s,dx=Math.abs(e.x-player.x);
  aimTarget=Math.atan2(py-hy,dx);
  aimMax=clamp(aimTarget+26*DEG,42*DEG,82*DEG);
  aim=0;aimDir=1;
  aimSpeed=Math.min(165,62+S.level*8)*DEG*(WEAPONS[S.curW].laser?.8:1);

}

/* ================= СТРЕЛЬБА ================= */
function fire(){
  const w=WEAPONS[S.curW];
  shot={left:w.burst||1,t:0,hits:0};state='shooting';
}
function playerBullets(){
  const w=WEAPONS[S.curW],n=w.pellets||1,m=gunPoint(player,aim,w.len);
  for(let i=0;i<n;i++){
    const a=aim+(shotR()*2-1)*(w.spread||0)*DEG;
    bullets.push({x:m.x,y:m.y,vx:player.dir*Math.cos(a)*1500,vy:-Math.sin(a)*1500,from:'p',dmg:w.dmg,px:m.x,py:m.y});
  }
  player.kick=1;flashT=.06;shake=Math.max(shake,w.pellets?7:w.dmg>=3?6:3);sfx('shot',S.curW);
  if(w.burst)aim+=1.1*DEG;
}
function hitEnemy(b,head){
  const e=enemy;let d=b.dmg*(head?2:1);if(!e.boss&&head)d=99;
  e.hp-=d;e.flash=.1;shot&&shot.hits++;shake=Math.max(shake,head?9:5);
  burst(b.x,b.y,e.boss?'#ff3355':e.col,head?16:9,Math.sign(b.vx));
  if(e.hp<=0)killEnemy(head,b);
  else{sfx('hit');if(e.boss){S.coins+=2;runCoins+=2;addText(e.x,e.y-70*e.s,head?'В ГОЛОВУ! −'+d:'−'+d,head?'#ffc233':'#fff',head?24:20);}else addText(e.x,e.y-75*e.s,'БРОНЯ!','#c9d2e6',20);}
}
function killEnemy(head,b){
  const e=enemy;e.alive=false;
  const snap=Object.assign({},e);
  corpses.push({x:e.x,y:e.y,dir:e.dir,s:e.s,vx:Math.sign(b.vx)*rnd(170,280),vy:-rnd(260,400),vr:Math.sign(b.vx)*e.dir*rnd(5,10),rot:0,t:0,look:c=>drawEnemy(c,snap)});
  let gain;
  if(e.boss){
    gain=30+S.level*10;sfx('level');slow=.5;
    banner={t:2,txt:'УРОВЕНЬ '+S.level+' ПРОЙДЕН'};
    S.level++;kills=0;need=levelNeed(S.level);
    addText(e.x,e.y-80*e.s,'+'+gain,'#ffc233',34);
  }else{
    kills++;
    if(head){combo++;gain=Math.min(20,8+(combo-1)*2);slow=.14;sfx('head');
      addText(e.x,e.y-92*e.s,combo>1?'В ГОЛОВУ ×'+combo:'В ГОЛОВУ!','#ffc233',26);addText(e.x,e.y-64*e.s,'+'+gain,'#fff',22);}
    else{combo=0;gain=3;sfx('kill');addText(e.x,e.y-70*e.s,'+'+gain,'#fff',22);}
  }
  runKills++;if(runKills>S.best)S.best=runKills;
  S.coins+=gain;runCoins+=gain;sfx('coin');save();hud();
}
function enemyFire(){
  if(state!=='enemyTurn'||!enemy)return;
  const e=enemy,tx=player.x,ty=player.y-46,len=WEAPONS[e.gun].len;
  e.aim=-Math.atan2(ty-(e.y-22*e.s),Math.abs(tx-e.x));
  const m=gunPoint(e,e.aim,len),dx=tx-m.x,dy=ty-m.y,d=Math.hypot(dx,dy)||1;
  bullets.push({x:m.x,y:m.y,vx:dx/d*1300,vy:dy/d*1300,from:'e',dmg:1,px:m.x,py:m.y});
  e.kick=1;sfx('shot',e.gun);
}
function killPlayer(b){
  player.dead=true;const sk=S.curS;
  corpses.push({x:player.x,y:player.y,dir:player.dir,s:1,vx:Math.sign(b.vx)*rnd(170,260),vy:-rnd(280,380),vr:-Math.sign(b.vx)*player.dir*rnd(5,9),rot:0,t:0,look:c=>drawJoe(c,sk)});
  burst(b.x,b.y,'#ffc233',18,Math.sign(b.vx));shake=14;slow=.3;sfx('die');state='dead';save();
  const res={seed:RUN.seed,level:RUN.level0,kills:runKills,coins:runCoins};
  post(Object.assign({type:'result',challenge:CH},res));
  after(1.1,()=>{
    const h=$('ovh');
    if(CH){
      const d=runKills-RUN.target;
      h.textContent=d>0?'ПОБЕДА!':d===0?'НИЧЬЯ':'НЕ ХВАТИЛО';h.style.color=d>0?'#5cff5c':d===0?'#ffc233':'#ff4d6d';
      $('ovtxt').innerHTML='Ты: <b>'+runKills+'</b> · '+esc(RUN.from||'Друг')+': <b>'+RUN.target+'</b><br>Заработано монет: <b>'+runCoins+'</b>';
    }else{
      h.textContent='ПРОМАХ!';h.style.color='';
      $('ovtxt').innerHTML='Уровень <b>'+S.level+'</b> · побеждено врагов: <b>'+runKills+'</b><br>Заработано монет: <b>'+runCoins+'</b>';
    }
    const bc=$('bChal');bc.hidden=!(EMBED&&runKills>0);bc.innerHTML=CH?'&#9876; ОТВЕТНЫЙ ВЫЗОВ':'&#9876; ВЫЗОВ ДРУГУ';bc.onclick=()=>{sfx('click');post(Object.assign({type:'challenge'},res));};
    $('over').hidden=false;$('bHome').hidden=true;
  });
}
function advance(){
  const k=player.k;adv={t:0,dur:.62,px0:player.x,px1:platX(k+1),e:null};
  if(enemy&&enemy.alive){const m=enemy.k+1,xx=95+rngFor(m,2,++advN)()*55;adv.e={x0:enemy.x,x1:m%2===0?xx:W-xx};enemy.dir=Math.sign(adv.e.x1-enemy.x)||1;enemy.aim=0;}
  state='advance';
}

/* ================= ЭФФЕКТЫ ================= */
function burst(x,y,col,n,dir){
  for(let i=0;i<n;i++)parts.push({x,y,vx:dir*rnd(40,330)+rnd(-90,90),vy:rnd(-340,60),col,sz:rnd(3,7),t:0,life:rnd(1.6,3.2),band:player?player.k:0,rest:false});
  if(parts.length>320)parts.splice(0,parts.length-320);
}
function sparks(x,y){for(let i=0;i<5;i++)parts.push({x,y,vx:rnd(-160,160),vy:rnd(-260,-40),col:'#ffe9a6',sz:rnd(2,4),t:0,life:rnd(.2,.45),band:-9999,rest:false});}
function addText(x,y,txt,col,size){texts.push({x:clamp(x,90,W-90),y,txt,col,size:size||22,t:0});}

/* ================= ОБНОВЛЕНИЕ ================= */
function update(dt){
  time+=dt;
  for(let i=timers.length-1;i>=0;i--){const t=timers[i];t.t-=dt;if(t.t<=0){timers.splice(i,1);t.fn();}}
  const tp=PALS[(S.level-1)%PALS.length],kk=Math.min(1,dt*1.6);pal=[mix(pal[0],tp[0],kk),mix(pal[1],tp[1],kk)];
  if(player.kick>0)player.kick=Math.max(0,player.kick-dt*9);
  if(flashT>0)flashT-=dt;
  const e=enemy;
  if(e){if(e.kick>0)e.kick=Math.max(0,e.kick-dt*9);if(e.flash>0)e.flash-=dt;}

  if(state==='spawn'){
    e.t+=dt;const p=Math.min(1,e.t/.45);e.x=lerp(e.sx,e.tx,1-(1-p)*(1-p));
    if(p>=1)setupAim();
  }else if(state==='aim'){
    aim+=aimDir*aimSpeed*dt;
    if(aim>aimMax){aim=aimMax;aimDir=-1;}else if(aim<0){aim=0;aimDir=1;}
  }else if(state==='shooting'){
    shot.t-=dt;
    while(shot.left>0&&shot.t<=0){playerBullets();shot.left--;shot.t+=.07;}
    if(shot.left===0&&!bullets.some(b=>b.from==='p')){
      const hits=shot.hits;shot=null;
      if(hits>0){state='pause';after(.3,advance);}
      else{combo=0;sfx('miss');addText(e.x,e.y-80*e.s,'МИМО!','#fff',24);state='enemyTurn';
        e.aim=-Math.atan2((player.y-46)-(e.y-22*e.s),Math.abs(player.x-e.x));after(.45,enemyFire);}
    }
  }else if(state==='advance'){
    adv.t+=dt;const p=Math.min(1,adv.t/adv.dur),q=p*p*(3-2*p),k=player.k;
    player.x=lerp(adv.px0,adv.px1,q);player.y=surf(k,player.x)-Math.abs(Math.sin(p*Math.PI*5))*5*(p<1?1:0);
    if(adv.e&&e){e.x=lerp(adv.e.x0,adv.e.x1,q);e.y=surf(k+1,e.x)-Math.abs(Math.sin(p*Math.PI*5))*5*(p<1?1:0);}
    if(p>=1){
      player.k=k+1;player.y=platY(k+1);player.dir=facing(k+1);
      if(adv.e&&e){e.k++;e.y=platY(e.k);e.dir=facing(e.k);adv=null;setupAim();}
      else{adv=null;spawnEnemy();}
      hud();
    }
  }

  // пули
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.px=b.x;b.py=b.y;
    const sp=Math.hypot(b.vx,b.vy),n=Math.max(1,Math.ceil(sp*dt/6)),sx=b.vx*dt/n,sy=b.vy*dt/n;let dead=false;
    for(let j=0;j<n&&!dead;j++){
      b.x+=sx;b.y+=sy;
      if(b.from==='p'){
        if(e&&e.alive&&state!=='spawn'){
          const s=e.s,inX=Math.abs(b.x-e.x);
          if(inX<=17*s&&b.y>=e.y-62*s&&b.y<e.y-31*s){hitEnemy(b,true);dead=true;break;}
          if(inX<=13*s&&b.y>=e.y-31*s&&b.y<=e.y){hitEnemy(b,false);dead=true;break;}
        }
        if(b.y>=surf(player.k,b.x)){sparks(b.x,b.y);dead=true;}
      }else if(!player.dead&&Math.abs(b.x-player.x)<=16&&b.y>=player.y-62&&b.y<=player.y){killPlayer(b);dead=true;}
      if(b.x<-60||b.x>W+60||b.y<camY-80||b.y>camY+H+80)dead=true;
    }
    if(dead)bullets.splice(i,1);
  }
  // частицы
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue;}
    if(p.rest)continue;
    p.vy+=1100*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.band>-9999){const g=surf(p.band,p.x);if(p.y>=g&&p.vy>0){p.y=g;p.rest=true;}}
  }
  for(let i=corpses.length-1;i>=0;i--){const c=corpses[i];c.t+=dt;c.vy+=1300*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=c.vr*dt;if(c.t>1.6)corpses.splice(i,1);}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.t+=dt;t.y-=46*dt;if(t.t>1)texts.splice(i,1);}
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  camY+=((player.y-640)-camY)*Math.min(1,dt*6);
  if(shake>0)shake=Math.max(0,shake-dt*40);
  hudBoss();
}

/* ================= ОТРИСОВКА ================= */
function bandPath(i){
  const y=platY(i),odd=i&1,X=x=>odd?W-x:x,bot=camY+H+20;
  ctx.beginPath();ctx.moveTo(X(-20),y);ctx.lineTo(X(FLAT),y);
  for(let s=0;s<NS;s++){ctx.lineTo(X(FLAT+s*SW),y-(s+1)*SH);ctx.lineTo(X(FLAT+(s+1)*SW),y-(s+1)*SH);}
  ctx.lineTo(X(W+20),y-PH);ctx.lineTo(X(W+20),bot);ctx.lineTo(X(-20),bot);ctx.closePath();
}
function decor(i,col){
  const t=Math.floor(hsh(i)*7),y=platY(i);if(t<3)return;
  ctx.save();if(i&1){ctx.translate(W,0);ctx.scale(-1,1);}ctx.translate(0,y);
  if(t===3){box(ctx,col,50,-128,5,128);box(ctx,col,50,-128,34,5,2);poly(ctx,col,[72,-124,96,-124,102,-112,66,-112]);
    const g=ctx.createLinearGradient(0,-112,0,0);g.addColorStop(0,'rgba(255,255,255,.13)');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(68,-112);ctx.lineTo(100,-112);ctx.lineTo(150,0);ctx.lineTo(20,0);ctx.closePath();ctx.fill();}
  else if(t===4){box(ctx,col,28,-36,56,6,2);box(ctx,col,34,-30,5,30);box(ctx,col,73,-30,5,30);box(ctx,col,6,-20,16,5,2);box(ctx,col,12,-15,4,15);box(ctx,col,90,-20,16,5,2);box(ctx,col,96,-15,4,15);}
  else if(t===5){box(ctx,col,36,-16,26,16,3);box(ctx,col,44,-58,10,44,5);box(ctx,col,30,-44,8,16,4);box(ctx,col,30,-34,18,7,3);box(ctx,col,60,-50,8,18,4);box(ctx,col,52,-38,14,7,3);}
  else{box(ctx,col,26,-34,34,34,3);box(ctx,col,64,-26,26,26,3);box(ctx,col,36,-58,24,24,3);}
  ctx.restore();
}
function draw(){
  const sx=shake?rnd(-shake,shake):0,sy=shake?rnd(-shake,shake):0;
  ctx.fillStyle=css(pal[0]);ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(sx,-camY+sy);
  const iTop=Math.ceil(-camY/PH)+1,iBot=Math.floor(-(camY+H)/PH)-1;
  for(let i=iTop;i>=iBot;i--){
    const t=clamp((platY(i)-camY)/H,0,1),col=mix(pal[0],pal[1],.04+t*t*.9+t*.1);
    bandPath(i);ctx.fillStyle=css(col);ctx.fill();
    decor(i,css(mix(col,pal[1],.28)));
  }
  // осевшие частицы и летящие
  for(const p of parts){ctx.globalAlpha=clamp((p.life-p.t)*2,0,1);ctx.fillStyle=p.col;ctx.fillRect(p.x-p.sz/2,p.y-(p.rest?p.sz*.6:p.sz/2),p.sz,p.rest?p.sz*.6:p.sz);}
  ctx.globalAlpha=1;
  for(const c of corpses){ctx.globalAlpha=clamp(1.6-c.t,0,1);drawDude(ctx,c.x,c.y,c.dir,c.s,c.look,-1,0,0,c.rot);}
  ctx.globalAlpha=1;
  const e=enemy;
  if(e&&e.alive){
    const bob=state==='spawn'?Math.abs(Math.sin(e.t*22))*4:0;
    if(e.flash>0)SIL='#fff';
    drawDude(ctx,e.x,e.y-bob,e.dir,e.s,c=>drawEnemy(c,e),e.gun,e.aim,e.kick,0);SIL=null;
  }
  if(!player.dead){
    const pa=(state==='aim'||state==='shooting'||state==='pause')?aim:0;
    const idle=state==='menu'?Math.sin(time*3)*1.5:0;
    drawDude(ctx,player.x,player.y+idle*0,player.dir,1,c=>drawJoe(c,S.curS),S.curW,pa+(state==='menu'?Math.sin(time*2)*.06+.1:0),player.kick,0);
    const w=WEAPONS[S.curW];
    if(state==='aim'){
      const m=gunPoint(player,aim,w.len),dx=player.dir*Math.cos(aim),dy=-Math.sin(aim);
      if(w.laser){ctx.strokeStyle='rgba(255,60,90,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x+dx*700,m.y+dy*700);ctx.stroke();}
      for(let i=1;i<=7;i++){ctx.globalAlpha=1-i/8.5;disc(ctx,"#fff",m.x+dx*i*18,m.y+dy*i*18,4.6-i*.35);}
      ctx.globalAlpha=1;
    }
    if(flashT>0){const m=gunPoint(player,aim,w.len+6);ctx.save();ctx.translate(m.x,m.y);ctx.rotate(time*40);poly(ctx,'#fff3b0',[0,-13,4,-4,13,0,4,4,0,13,-4,4,-13,0,-4,-4]);ctx.restore();}
  }
  // пули
  ctx.lineCap='round';
  for(const b of bullets){
    const d=Math.hypot(b.vx,b.vy)||1,tx=b.x-b.vx/d*34,ty=b.y-b.vy/d*34;
    ctx.strokeStyle=b.from==='p'?'rgba(255,240,170,.9)':'rgba(255,90,110,.9)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // всплывающие надписи
  ctx.textAlign='center';
  for(const t of texts){
    const a=t.t<.7?1:1-(t.t-.7)/.3,sc=t.t<.12?.6+t.t/.12*.4:1;
    ctx.globalAlpha=a;ctx.font='900 '+Math.round(t.size*sc)+'px "Arial Black","Segoe UI",sans-serif';
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillText(t.txt,t.x,t.y+3);ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x,t.y);
  }
  ctx.globalAlpha=1;ctx.restore();

  if(banner){
    const p=2-banner.t,sc=p<.18?p/.18:1,a=banner.t<.4?banner.t/.4:1;
    ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,330);ctx.scale(sc,sc);ctx.rotate(-.05);
    box(ctx,'#ffc233',-235,-40,470,80,18);ctx.fillStyle='#231700';ctx.font='900 30px "Arial Black","Segoe UI",sans-serif';ctx.textAlign='center';ctx.fillText(banner.txt,0,11);ctx.restore();
  }
  if(state==='aim'&&S.level===1&&runKills===0){
    ctx.globalAlpha=.75+Math.sin(time*5)*.2;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 21px "Arial Black","Segoe UI",sans-serif';
    ctx.fillText('ЖМИ, КОГДА ПРИЦЕЛ',W/2,H-120);ctx.fillText('СМОТРИТ НА ВРАГА',W/2,H-92);ctx.globalAlpha=1;
  }
  // лёгкая виньетка сверху
  const g=ctx.createLinearGradient(0,0,0,150);g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,150);
}

/* ================= ИНТЕРФЕЙС ================= */
let hudCache='';
function hud(){
  const prog=enemy&&enemy.boss&&enemy.alive?1:kills/(need+1);
  const key=S.coins+'|'+S.level+'|'+prog;if(key===hudCache)return;hudCache=key;
  $('coinv').textContent=S.coins;$('shopcoinv').textContent=S.coins;
  $('lvltxt').textContent='Уровень '+S.level;$('lvlfill').style.width=Math.round(prog*100)+'%';
}
let bossCache='';
function hudBoss(){
  const on=!!(enemy&&enemy.boss&&enemy.alive),key=on?enemy.name+enemy.hp:'';
  if(key===bossCache)return;bossCache=key;
  $('boss').hidden=!on;
  if(on){$('bossname').textContent='БОСС · '+enemy.name.toUpperCase();$('bossfill').style.width=Math.max(0,enemy.hp/enemy.max*100)+'%';hud();}
}
function iconGun(cn,id,sil,scale){
  const c=cn.getContext('2d'),w=cn.width,h=cn.height,L=WEAPONS[id].len;
  c.clearRect(0,0,w,h);c.save();c.translate(w/2-(L-22)/2*scale+4,h/2+10);c.scale(scale,scale);SIL=sil;drawGun(c,id);SIL=null;c.restore();
}
function iconSkin(cn,id,sil,scale){
  const c=cn.getContext('2d'),w=cn.width,h=cn.height;
  c.clearRect(0,0,w,h);c.save();c.translate(w/2,h-6);c.scale(scale,scale);SIL=sil;drawSkin(c,id);SIL=null;c.restore();
}
function refreshMenu(){
  iconSkin($('bSkin').querySelector('canvas'),S.curS,null,1.45);
  iconGun($('bGun').querySelector('canvas'),S.curW,null,2.2);
  $('bMus').className='mb half'+(S.mus?'':' off');$('bSnd').className='mb half'+(S.snd?'':' off');
}
let shopKind='w';
function openShop(kind){shopKind=kind;$('shop').hidden=false;$('shoptitle').textContent=kind==='w'?'ОРУЖИЕ':'СКИНЫ';renderShop();}
function renderShop(){
  const isW=shopKind==='w',list=isW?WEAPONS:SKINS,own=isW?S.ownW:S.ownS,cur=isW?S.curW:S.curS,grid=$('grid');
  grid.innerHTML='';
  list.forEach((it,i)=>{
    const has=own.indexOf(i)>=0,b=document.createElement('button');
    b.className='card '+(i===cur?'sel':has?'own':'lock'+(S.coins<it.price?' no':''));
    const nm=document.createElement('b');nm.textContent=it.n;
    const cn=document.createElement('canvas');cn.width=280;cn.height=172;
    const sm=document.createElement('small');
    if(i===cur)sm.textContent='Выбрано';else if(has)sm.textContent='Выбрать';else{const ic=document.createElement('i');ic.className='coin';sm.appendChild(ic);sm.appendChild(document.createTextNode(it.price));}
    b.appendChild(nm);b.appendChild(cn);b.appendChild(sm);grid.appendChild(b);
    if(isW)iconGun(cn,i,has?null:'#03060d',3.3);else iconSkin(cn,i,has?null:'#03060d',1.95);
    b.addEventListener('click',()=>pick(i,b));
  });
  $('stat').textContent=isW?WEAPONS[S.curW].n+' — '+WEAPONS[S.curW].info:'Скин меняет только внешний вид';
  // превью
  const pc=$('prev'),c=pc.getContext('2d');c.clearRect(0,0,992,340);
  c.fillStyle='rgba(255,255,255,.07)';c.beginPath();c.ellipse(496,300,230,22,0,0,7);c.fill();
  drawDude(c,470,300,1,3.6,k=>drawJoe(k,S.curS),S.curW,.18,0,0);
  hud();$('shopcoinv').textContent=S.coins;
}
function pick(i,el){
  initAudio();
  const isW=shopKind==='w',list=isW?WEAPONS:SKINS,own=isW?S.ownW:S.ownS;
  if(own.indexOf(i)<0){
    if(S.coins<list[i].price){sfx('deny');toast('Не хватает '+(list[i].price-S.coins)+' монет');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');return;}
    S.coins-=list[i].price;own.push(i);sfx('buy');
  }else sfx('click');
  if(isW)S.curW=i;else S.curS=i;
  save();renderShop();refreshMenu();
}
let toastT=0;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),1500);}

/* ================= ЗВУК ================= */
let AC=null,sfxG=null,musG=null,nbuf=null,nextT=0,stepI=0;
function initAudio(){
  try{
    if(AC){if(AC.state==='suspended')AC.resume();return;}
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    AC=new A();sfxG=AC.createGain();musG=AC.createGain();sfxG.connect(AC.destination);musG.connect(AC.destination);
    sfxG.gain.value=.55;musG.gain.value=.3;
    nbuf=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    nextT=AC.currentTime+.1;setInterval(music,60);
  }catch(e){AC=null;}
}
function osc(t,f,d,type,v,slide,dest){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.03);
}
function noise(t,d,v,fq,dest,type){
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type=type||'lowpass';f.frequency.value=fq;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+d+.03);
}
function sfx(name,a){
  if(!AC||!S.snd||AC.state!=='running')return;
  try{
    const t=AC.currentTime,G=sfxG;
    if(name==='shot'){if(a===0){noise(t,.07,.35,1100,G);osc(t,240,.05,'square',.1,-120,G);}else{noise(t,.14+(a>5?.06:0),.6,2600-a*170,G);osc(t,190-a*8,.11,'square',.28,-130,G);}}
    else if(name==='hit'){osc(t,150,.09,'sawtooth',.22,-80,G);noise(t,.05,.25,700,G);}
    else if(name==='kill'){osc(t,220,.12,'square',.2,-140,G);noise(t,.08,.3,900,G);}
    else if(name==='head'){osc(t,880,.09,'square',.16,0,G);osc(t+.07,1320,.16,'square',.16,0,G);noise(t,.06,.3,1200,G);}
    else if(name==='coin'){osc(t+.05,1250,.05,'triangle',.22,0,G);osc(t+.1,1680,.09,'triangle',.22,0,G);}
    else if(name==='miss'){osc(t,300,.22,'sine',.2,-180,G);}
    else if(name==='die'){osc(t,330,.45,'sawtooth',.26,-290,G);noise(t,.2,.4,600,G);}
    else if(name==='click'){osc(t,620,.04,'square',.12,0,G);}
    else if(name==='deny'){osc(t,170,.12,'square',.18,-40,G);osc(t+.1,130,.14,'square',.18,-40,G);}
    else if(name==='buy'){[660,880,1100,1320].forEach((f,i)=>osc(t+i*.06,f,.1,'triangle',.22,0,G));}
    else if(name==='level'){[523,659,784,1047,1319].forEach((f,i)=>osc(t+i*.09,f,.18,'square',.15,0,G));}
    else if(name==='boss'){osc(t,110,.5,'sawtooth',.25,-50,G);osc(t+.18,82,.5,'sawtooth',.25,-30,G);}
  }catch(e){}
}
const BASS=[110,0,110,0,110,0,130.8,0,146.8,0,146.8,0,164.8,0,130.8,0,98,0,98,0,98,0,110,0,130.8,0,130.8,0,146.8,0,164.8,196];
const LEAD=[0,0,440,0,0,523,0,0,587,0,523,0,440,0,0,0,0,0,392,0,0,440,0,0,523,0,659,0,587,0,0,0];
function music(){
  if(!AC||AC.state!=='running')return;
  if(nextT<AC.currentTime)nextT=AC.currentTime+.05;
  try{
    while(nextT<AC.currentTime+.2){
      const s=stepI%32,t=nextT;
      if(S.mus){
        if(BASS[s])osc(t,BASS[s],.16,'triangle',.5,0,musG);
        if(s%8===0||s===22)osc(t,130,.14,'sine',.8,-95,musG);
        if(s%4===2)noise(t,.035,.22,6000,musG,'highpass');
        if(s%8===4)noise(t,.09,.3,1800,musG,'bandpass');
        if(LEAD[s]&&(stepI>>5)%2===1)osc(t,LEAD[s],.14,'square',.09,0,musG);
      }
      nextT+=60/108/4;stepI++;
    }
  }catch(e){}
}

/* ================= ВВОД ================= */
function onTap(){
  initAudio();
  if(state==='menu')startRun();
  else if(state==='aim')fire();
}
cv.addEventListener('pointerdown',ev=>{ev.preventDefault();onTap();});
window.addEventListener('keydown',ev=>{if((ev.code==='Space'||ev.code==='Enter')&&$('shop').hidden&&$('over').hidden){ev.preventDefault();onTap();}});
$('bSkin').addEventListener('click',()=>{initAudio();sfx('click');openShop('s');});
$('bGun').addEventListener('click',()=>{initAudio();sfx('click');openShop('w');});
$('bBack').addEventListener('click',()=>{sfx('click');$('shop').hidden=true;});
$('bMus').addEventListener('click',()=>{initAudio();S.mus=S.mus?0:1;save();refreshMenu();sfx('click');});
$('bSnd').addEventListener('click',()=>{initAudio();S.snd=S.snd?0:1;save();refreshMenu();sfx('click');});
$('bRetry').addEventListener('click',()=>{sfx('click');resetWorld();hud();startRun();});
$('bMenu').addEventListener('click',()=>{sfx('click');showMenu();});
$('bHome').addEventListener('click',()=>{sfx('click');save();if(EMBED&&state==='menu'){post({type:'exit'});return;}showMenu();});
document.addEventListener('visibilitychange',()=>{if(!AC)return;try{if(document.hidden)AC.suspend();else AC.resume();}catch(e){}});

/* ================= МАСШТАБ И ЦИКЛ ================= */
function fit(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H)||1;
  $('stage').style.transform='translate(-50%,-50%) scale('+s+')';
  const r=clamp(s*(window.devicePixelRatio||1),1,3);
  cv.width=Math.round(W*r);cv.height=Math.round(H*r);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
window.addEventListener('resize',fit);
let last=0;
function frame(ts){
  const rdt=Math.min(.033,Math.max(0,(ts-last)/1000)||0);last=ts;let dt=rdt;
  if(slow>0){slow-=rdt;dt*=.25;}
  update(dt);draw();requestAnimationFrame(frame);
}
fit();showMenu();requestAnimationFrame(frame);
window.__game={tap:onTap,retry:()=>{resetWorld();hud();startRun();},dbg:()=>({px:player.x,py:player.y,pk:player.k,pd:player.dir,ex:enemy&&enemy.x,ey:enemy&&enemy.y,es:enemy&&enemy.s,ek:enemy&&enemy.k,boss:enemy&&enemy.boss,hp:enemy&&enemy.hp}),info:()=>({state,aim,aimTarget,level:S.level,coins:S.coins,kills,runKills,bullets:bullets.length})};
</script>
