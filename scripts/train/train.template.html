<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Побег на поезде</title>
<style>
/* стили — как в «Меткий Джо» (public/games/joe.html), чтобы игры выглядели одной семьёй */
@@CSS@@
#title .l2.train{font-size:92px}
#title .l1.train{font-size:50px}
#note{position:absolute;left:0;right:0;bottom:178px;text-align:center;font-size:13px;opacity:.5;pointer-events:none;font-family:"Segoe UI",system-ui,sans-serif;font-weight:700}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="540" height="960"></canvas>

  <div id="hud">
    <div id="hudrow">
      <button id="bHome" hidden aria-label="В меню">&#10005;</button><span></span>
      <div id="coins"><i class="coin"></i><span id="coinv">0</span></div>
    </div>
    <div id="lvl"><div id="lvlfill"></div><span id="lvltxt">Вагон 0</span></div>
  </div>

  <div id="title"><div class="l1 train">ПОБЕГ НА</div><div class="l2 train">ПОЕЗДЕ</div></div>
  <div id="hint">НАЖМИ, ЧТОБЫ НАЧАТЬ</div>
  <div id="best"></div>
  <div id="note">Скин и оружие — из «Меткого Джо», монеты общие</div>

  <div id="menu">
    <button id="bSnd" class="mb half" aria-label="Звук">&#9668;))</button>
  </div>

  <div id="over" hidden>
    <div class="box">
      <h2 id="ovh">СОРВАЛСЯ!</h2>
      <p id="ovtxt"></p>
      <button id="bChal" class="big chal" hidden>&#9876; ВЫЗОВ ДРУГУ</button>
      <button id="bRetry" class="big">ЕЩЁ РАЗ</button>
      <button id="bMenu" class="ghost">В МЕНЮ</button>
    </div>
  </div>
</div>

<script src="look.js"></script>
<script>
'use strict';
/* ================= БАЗА (из «Меткий Джо») ================= */
@@HELPERS@@
@@DATA@@

/* ================= СОХРАНЕНИЕ ================= */
// Монеты, скин и оружие общие с «Меткий Джо» — лежат в его сейве. Своё у поезда — только рекорд и звук.
const JKEY='metkiy-joe-v1',DKEY='train-v1';
const JDEF={coins:0,level:1,ownW:[0],ownS:[0],curW:0,curS:0,snd:1,mus:1,best:0};
function readJ(){try{const r=JSON.parse(localStorage.getItem(JKEY)||'null');if(r&&typeof r==='object'&&Array.isArray(r.ownW)&&Array.isArray(r.ownS))return Object.assign({},JDEF,r);}catch(e){}return Object.assign({},JDEF);}
const okId=v=>Number.isInteger(v)&&v>=0&&v<=8;
let J=readJ();
const SKIN=okId(J.curS)?J.curS:0,GUN=okId(J.curW)?J.curW:0;
function addCoins(n){J=readJ();J.coins=(J.coins|0)+n;try{localStorage.setItem(JKEY,JSON.stringify(J));}catch(e){}}
let D={best:0,snd:1};
try{const r=JSON.parse(localStorage.getItem(DKEY)||'null');if(r&&typeof r==='object')D=Object.assign(D,r);}catch(e){}
function saveD(){try{localStorage.setItem(DKEY,JSON.stringify(D));}catch(e){}}

/* ================= ВСТРАИВАНИЕ В «ИГРЫ ДЖО» ================= */
// ?embed=1 — открыта внутри мини-аппа; ?mode=challenge&seed=&target=&from= — вызов от друга
const QS=new URLSearchParams(location.search);
const EMBED=QS.get('embed')==='1'&&window.parent!==window;
const CH=QS.get('mode')==='challenge';
const RUN={seed:(Number(QS.get('seed'))>>>0),target:clamp(parseInt(QS.get('target'),10)||0,0,100000),from:(QS.get('from')||'').slice(0,12)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function post(m){if(EMBED)try{window.parent.postMessage(Object.assign({src:'train'},m),location.origin);}catch(e){}}
// Детерминированный рандом: одинаковый сид = одинаковый поезд (вагоны, промежутки, препятствия, монеты)
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rngFor(){let h=(RUN.seed^0x7EA1)|0;for(let i=0;i<arguments.length;i++){h=Math.imul(h^(arguments[i]|0),0x9E3779B1);h^=h>>>15;}return mulberry(h);}

/* ================= РИСОВАНИЕ ПЕРСОНАЖЕЙ (дословно из «Меткий Джо») ================= */
@@ART@@

/* ================= ПОБЕГ НА ПОЕЗДЕ ================= */
const ROOF=640,PX=120,SC=1.2;
const G=2700,JUMP=1080,CUT=.55,COYOTE=.09,BUFFER=.13;   // тап ≈ 65 px (бочка 46), полный прыжок ≈ 216 px
const SPEED0=340,SPEED_MAX=640;
const speedAt=d=>Math.min(SPEED_MAX,SPEED0+Math.max(0,d)/120);  // поезд разгоняется с пройденным путём (максимум ~к 30-му вагону)
const AIR=2*JUMP/G;                                               // время полного прыжка, ~0.8 с
const HW=12*SC,HH=62*SC;                                          // полуширина и рост Джо
const DIM={barrel:{w:38,h:46},crate:{w:46,h:46},stack:{w:46,h:92},bandit:{w:30,h:72}};

let state='menu',dist=0,groundX=0,carsDone=0,runCoins=0,lastReason='fall',deadT=0,clackT=0;
let p=null,cars=[],corpses=[],parts=[],texts=[],timers=[],banner=null;
let shake=0,time=0,pressT=-9,holding=false;
let pal=[PALS[0][0].slice(),PALS[0][1].slice()];
const after=(t,fn)=>timers.push({t,fn});
const palFor=n=>PALS[Math.floor(n/10)%PALS.length];

// Вагон k целиком определяется сидом и номером k — не зависит от того, как игрок бежал.
// Промежутки и препятствия подобраны так, чтобы любой из них можно было перепрыгнуть.
function genCar(k){
  const prev=cars[k-1],g=rngFor(k,3);
  const x0=prev?prev.x0+prev.len+prev.gap:-300;
  const sp0=speedAt(x0);
  // вагоны длиннее на высокой скорости — чтобы между промежутками было где развернуться
  const len=k===0?560:Math.round(sp0*(1.9+g()*1.0));
  const sp=speedAt(x0+len);
  const gap=k===0?90:Math.round(clamp(sp*(0.18+g()*(0.26+Math.min(.16,k*.006))),70,sp*AIR*0.72));
  const obs=[],coins=[];
  if(k>=2){
    const n=g()<Math.min(.9,.45+k*.03)?(g()<Math.min(.6,.15+k*.02)?2:1):0;
    // первое препятствие — дальше, чем можно улететь полным прыжком через предыдущий промежуток
    let cursor=Math.round(Math.max(90+sp*0.35,sp*AIR-(prev?prev.gap:0)+40));
    for(let i=0;i<n;i++){
      const r=g();
      const type=k>=6&&r<.3?'bandit':k>=10&&r<.45?'stack':r<.7?'barrel':'crate';
      const tall=type==='bandit'||type==='stack';
      // у конца вагона: после низкого хватит короткого прыжка, после высокого нужен запас на полный
      const tail=Math.max(90,sp*(tall?0.8:0.5));
      const room=len-cursor-DIM[type].w-tail;if(room<0)break;
      const x=Math.round(cursor+g()*Math.min(room,200));
      const o=Object.assign({type,x,alive:true},DIM[type]);
      if(type==='bandit'){o.col=ECOL[Math.floor(g()*ECOL.length)];o.col2='#22283a';o.hat=Math.floor(g()*3);}
      obs.push(o);cursor=x+o.w+Math.max(170,sp*(tall?0.75:0.55));
    }
  }
  if(k>=1&&g()<.6){for(let i=0;i<4;i++){const t=(i+.5)/4;coins.push({x:len+gap*t,y:ROOF-70-Math.sin(t*Math.PI)*110,taken:false});}}
  if(k>=1){const first=obs.length?obs[0].x:len;if(first>260&&g()<.6)for(let i=0;i<4;i++)coins.push({x:70+i*44,y:ROOF-42,taken:false});}
  cars[k]={k,x0,len,gap,obs,coins};
}
function carAt(k){while(cars.length<=k)genCar(cars.length);return cars[k];}
// вагоны, которые попадают в отрезок мира [a, b]
function carsIn(a,b){
  const out=[];
  for(let k=Math.max(0,carsDone-2);;k++){const c=carAt(k);if(c.x0>b)break;if(c.x0+c.len+c.gap>=a)out.push(c);}
  return out;
}

function resetRun(){
  if(!CH)RUN.seed=(Math.random()*4294967296)>>>0;
  cars=[];dist=0;carsDone=0;runCoins=0;lastReason='fall';deadT=0;banner=null;
  p={y:ROOF,vy:0,ground:true,lastGround:0,cut:true,dead:false};
  corpses=[];parts=[];texts=[];timers=[];shake=0;holding=false;pressT=-9;
  carAt(4);
}
function startRun(){
  $('title').hidden=$('hint').hidden=$('best').hidden=$('menu').hidden=$('note').hidden=true;
  $('over').hidden=true;$('bHome').hidden=false;
  resetRun();state='run';hud();
}
function die(reason){
  if(state!=='run')return;
  state='dead';lastReason=reason;p.dead=true;deadT=0;
  if(reason==='hit'){
    corpses.push({x:PX,y:p.y,dir:1,s:SC,vx:-rnd(160,220),vy:-rnd(420,520),vr:-rnd(6,9),rot:0,t:0,look:c=>drawJoe(c,SKIN)});
    burst(PX,p.y-HH/2,'#ffc233',18,-1);shake=12;sfx('die');
  }else sfx('fall');
  if(carsDone>D.best){D.best=carsDone;saveD();}
  const res={seed:RUN.seed,level:1,kills:carsDone,coins:runCoins};
  post(Object.assign({type:'result',challenge:CH},res));
  after(1.2,()=>showOver(res));
}
function showOver(res){
  const h=$('ovh');
  if(CH){
    const d=carsDone-RUN.target;
    h.textContent=d>0?'ПОБЕДА!':d===0?'НИЧЬЯ':'НЕ ХВАТИЛО';h.style.color=d>0?'#5cff5c':d===0?'#ffc233':'#ff4d6d';
    $('ovtxt').innerHTML='Ты: <b>'+carsDone+'</b> · '+esc(RUN.from||'Друг')+': <b>'+RUN.target+'</b><br>Заработано монет: <b>'+runCoins+'</b>';
  }else{
    h.textContent=lastReason==='fall'?'СОРВАЛСЯ!':'ВРЕЗАЛСЯ!';h.style.color='';
    $('ovtxt').innerHTML='Вагонов: <b>'+carsDone+'</b> · рекорд: <b>'+D.best+'</b><br>Заработано монет: <b>'+runCoins+'</b>';
  }
  const bc=$('bChal');bc.hidden=!(EMBED&&carsDone>0);bc.innerHTML=CH?'&#9876; ОТВЕТНЫЙ ВЫЗОВ':'&#9876; ВЫЗОВ ДРУГУ';
  bc.onclick=()=>{sfx('click');post(Object.assign({type:'challenge'},res));};
  $('over').hidden=false;$('bHome').hidden=true;
}
function showMenu(){
  resetRun();state='menu';
  $('title').hidden=$('hint').hidden=$('menu').hidden=$('note').hidden=false;$('over').hidden=true;
  $('bHome').hidden=!EMBED;
  const b=$('best');b.className='';b.hidden=!D.best;b.textContent='Рекорд: '+D.best+' вагонов';
  if(CH){b.hidden=false;b.className='ch';b.textContent='ВЫЗОВ ОТ '+(RUN.from||'ДРУГА').toUpperCase()+': ПОБЕЙ '+RUN.target;}
  $('bSnd').className='mb half'+(D.snd?'':' off');
  hud();
}

/* ================= ЭФФЕКТЫ ================= */
function burst(x,y,col,n,dir){
  for(let i=0;i<n;i++)parts.push({x,y,vx:dir*rnd(40,300)+rnd(-90,90),vy:rnd(-340,40),col,sz:rnd(3,7),t:0,life:rnd(.8,1.6)});
  if(parts.length>300)parts.splice(0,parts.length-300);
}
function addText(x,y,txt,col,size){texts.push({x:clamp(x,90,W-90),y,txt,col,size:size||22,t:0});}

/* ================= ОБНОВЛЕНИЕ ================= */
function update(dt){
  time+=dt;
  for(let i=timers.length-1;i>=0;i--){const t=timers[i];t.t-=dt;if(t.t<=0){timers.splice(i,1);t.fn();}}
  const tp=palFor(carsDone),kk=Math.min(1,dt*1.2);pal=[mix(pal[0],tp[0],kk),mix(pal[1],tp[1],kk)];

  if(state==='menu'){groundX+=320*dt;}
  else if(state==='run'||state==='dead'){
    const k=state==='dead'?Math.max(0,1-deadT*1.6):1;
    if(state==='dead')deadT+=dt;
    const sp=speedAt(dist)*k;
    dist+=sp*dt;groundX+=(sp*1.6+260*k)*dt;
    if(state==='run'){clackT-=dt;if(clackT<=0){clackT=.36;sfx('clack');}}

    // прыжок: буфер нажатия и «койот» — прощаем нажатие чуть раньше приземления и чуть позже края
    if(state==='run'&&time-pressT<BUFFER&&(p.ground||time-p.lastGround<COYOTE)&&p.cut){
      p.vy=-JUMP;p.ground=false;p.cut=false;pressT=-9;sfx('jump');
    }
    if(!holding&&p.vy<0&&!p.cut){p.vy*=CUT;p.cut=true;}   // отпустил рано — прыжок ниже
    if(p.vy>=0)p.cut=true;

    const prevY=p.y;p.vy+=G*dt;p.y+=p.vy*dt;
    const wx=dist+PX;

    if(state==='run'){
      // на что можно встать: крыша под Джо и верх ящиков/бочек
      let top=Infinity;
      for(const c of carsIn(wx-HW,wx+HW)){
        if(wx+HW>c.x0&&wx-HW<c.x0+c.len){
          top=Math.min(top,ROOF);
          for(const o of c.obs){if(!o.alive||o.type==='bandit')continue;const ox=c.x0+o.x;if(wx+HW>ox&&wx-HW<ox+o.w)top=Math.min(top,ROOF-o.h);}
        }
      }
      const wasGround=p.ground;
      if(p.vy>=0&&prevY<=top+2&&p.y>=top){p.y=top;p.vy=0;p.ground=true;p.lastGround=time;if(!wasGround)burst(PX,top,'rgba(255,255,255,.6)',4,0);}
      else p.ground=false;

      // столкновения: бандита можно сбить прыжком сверху, во всё остальное — врезаешься
      for(const c of carsIn(wx-60,wx+60)){
        for(const o of c.obs){
          if(!o.alive)continue;
          const ox=c.x0+o.x,oy=ROOF-o.h;
          if(!(wx+HW>ox&&wx-HW<ox+o.w))continue;
          if(!(p.y>oy+4&&p.y-HH<ROOF))continue;
          if(o.type==='bandit'&&p.vy>0&&prevY<=oy+14){
            o.alive=false;p.vy=-JUMP*.72;p.cut=true;
            corpses.push({x:ox+o.w/2-dist,y:ROOF,dir:-1,s:1.15,vx:rnd(120,200),vy:-rnd(250,350),vr:rnd(5,8),rot:0,t:0,look:cc=>drawEnemy(cc,o),world:false});
            burst(ox+o.w/2-dist,oy,o.col,14,1);addCoins(5);runCoins+=5;addText(PX+40,oy-30,'+5','#ffc233',28);sfx('stomp');hud();
            continue;
          }
          if(o.type!=='bandit'&&prevY<=oy+2)continue;   // стоит сверху — это не столкновение
          die('hit');break;
        }
        if(state!=='run')break;
      }

      // монеты
      for(const c of carsIn(wx-40,wx+40))for(const m of c.coins){
        if(m.taken)continue;const mx=c.x0+m.x;
        if(Math.abs(mx-wx)<28&&Math.abs(m.y-(p.y-HH/2))<48){m.taken=true;addCoins(1);runCoins++;sfx('coin');hud();}
      }
      // пройденные вагоны: каждые 10 — бонус
      while(carAt(carsDone+1).x0<wx-HW){
        carsDone++;
        if(carsDone%10===0){addCoins(10);runCoins+=10;banner={t:1.6,txt:carsDone+' ВАГОНОВ!'};sfx('bonus');}
        hud();
      }
      if(p.y>ROOF+110)die('fall');
    }
  }

  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.t+=dt;if(q.t>q.life){parts.splice(i,1);continue;}q.vy+=1100*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;}
  for(let i=corpses.length-1;i>=0;i--){const c=corpses[i];c.t+=dt;c.vy+=1300*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=c.vr*dt;if(c.t>1.6)corpses.splice(i,1);}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.t+=dt;t.y-=46*dt;if(t.t>1)texts.splice(i,1);}
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  if(shake>0)shake=Math.max(0,shake-dt*40);
}

/* ================= ОТРИСОВКА ================= */
function mountains(off,col,base,amp,seedK){
  const span=W+200,o=((off%span)+span)%span;
  for(let rep=-1;rep<=1;rep++){
    const pts=[],x0=rep*span-o;
    pts.push(x0,ROOF+20);
    for(let i=0;i<=8;i++){const x=x0+i*span/8,h=hsh(i+seedK)*amp;pts.push(x,base-h);}
    pts.push(x0+span,ROOF+20);poly(ctx,col,pts);
  }
}
function drawCar(c){
  const x=c.x0-dist;if(x>W+40||x+c.len<-40)return;
  const body=css(mix(pal[1],[40,30,60],.35)),dark=css(mix(pal[0],[0,0,0],.4)),light=css(mix(pal[1],[255,255,255],.35));
  box(ctx,body,x,ROOF,c.len,132,6);
  box(ctx,light,x-4,ROOF-6,c.len+8,12,4);
  for(let wx=x+22;wx+38<x+c.len-14;wx+=64)box(ctx,dark,wx,ROOF+30,38,30,4);
  box(ctx,css(mix(pal[1],[255,200,80],.5)),x,ROOF+86,c.len,10);
  disc(ctx,'#1b1b28',x+46,ROOF+140,17);disc(ctx,'#1b1b28',x+c.len-46,ROOF+140,17);
  disc(ctx,'#4a4a5e',x+46,ROOF+140,6);disc(ctx,'#4a4a5e',x+c.len-46,ROOF+140,6);
  box(ctx,'#1b1b28',x+c.len,ROOF+108,c.gap,8);   // сцепка между вагонами
}
function drawObstacle(o,c){
  if(!o.alive)return;
  const x=c.x0+o.x-dist,y=ROOF-o.h;if(x>W+40||x+o.w<-40)return;
  if(o.type==='barrel'){box(ctx,'#8a4b22',x,y,o.w,o.h,10);box(ctx,'#5c2f12',x,y+9,o.w,5);box(ctx,'#5c2f12',x,y+o.h-14,o.w,5);box(ctx,'#b06a35',x+6,y+4,6,o.h-8,3);}
  else if(o.type==='crate'||o.type==='stack'){
    for(let i=0;i<o.h/46;i++){const yy=ROOF-46*(i+1);box(ctx,'#a8642e',x,yy,46,46,3);box(ctx,'#6e3d18',x+4,yy+4,38,38,2);box(ctx,'#a8642e',x+8,yy+8,30,30,2);
      ctx.save();ctx.translate(x+23,yy+23);ctx.rotate(Math.PI/4);box(ctx,'#6e3d18',-24,-3,48,6);ctx.restore();}
  }else if(o.type==='bandit'){
    drawDude(ctx,x+o.w/2,ROOF,-1,1.15,cc=>drawEnemy(cc,o),0,Math.sin(time*3+o.x)*.05,0,0);
  }
}
function draw(){
  const sx=shake?rnd(-shake,shake):0,sy=shake?rnd(-shake,shake):0;
  const g=ctx.createLinearGradient(0,0,0,ROOF);g.addColorStop(0,css(pal[0]));g.addColorStop(1,css(mix(pal[0],pal[1],.55)));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(sx,sy);
  disc(ctx,css(mix(pal[1],[255,230,160],.55)),W-130,250,64);
  mountains(groundX*.04,css(mix(pal[0],pal[1],.28)),480,120,3);
  mountains(groundX*.12,css(mix(pal[0],pal[1],.42)),560,80,11);
  // столбы вдоль путей проносятся быстрее поезда
  const pc=css(mix(pal[0],pal[1],.3)),po=groundX*.9%320;
  for(let x=-po;x<W+40;x+=320){box(ctx,pc,x,470,7,ROOF-430);box(ctx,pc,x-16,482,39,6);}
  // земля и рельсы
  box(ctx,css(mix(pal[0],pal[1],.62)),-20,ROOF+150,W+40,H-ROOF);
  box(ctx,'#2a2236',-20,ROOF+150,W+40,8);
  const to=groundX%46;for(let x=-to;x<W+20;x+=46)box(ctx,'#3a2f48',x,ROOF+160,24,8);

  for(const c of carsIn(dist-60,dist+W+60))drawCar(c);
  // монеты
  for(const c of carsIn(dist-60,dist+W+60))for(const m of c.coins){
    if(m.taken)continue;const mx=c.x0+m.x-dist;if(mx<-20||mx>W+20)continue;
    const by=Math.sin(time*5+m.x*.05)*4;disc(ctx,'#a45f00',mx,m.y+by+2,12);disc(ctx,'#ffc233',mx,m.y+by,12);disc(ctx,'#fff1a8',mx-3,m.y+by-3,4);
  }
  for(const c of carsIn(dist-60,dist+W+60))for(const o of c.obs)drawObstacle(o,c);

  for(const q of parts){ctx.globalAlpha=clamp((q.life-q.t)*2,0,1);ctx.fillStyle=q.col;ctx.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz);}
  ctx.globalAlpha=1;
  for(const c of corpses){ctx.globalAlpha=clamp(1.6-c.t,0,1);drawDude(ctx,c.x,c.y,c.dir,c.s,c.look,-1,0,0,c.rot);}
  ctx.globalAlpha=1;

  // Джо: бежит вприпрыжку, в прыжке наклоняется
  if(p&&!(p.dead&&lastReason==='hit')){
    const run=state==='run'&&p.ground;
    const bob=run?Math.abs(Math.sin(time*16))*5:0;
    const rot=p.ground?(run?Math.sin(time*16)*.05:0):clamp(p.vy/3200,-.28,.28);
    drawDude(ctx,PX,p.y-bob,1,SC,cc=>drawJoe(cc,SKIN),GUN,-1.05,0,rot);
  }

  ctx.textAlign='center';
  for(const t of texts){
    const a=t.t<.7?1:1-(t.t-.7)/.3,sc=t.t<.12?.6+t.t/.12*.4:1;
    ctx.globalAlpha=Math.max(0,a);ctx.font='900 '+Math.round(t.size*sc)+'px "Arial Black","Segoe UI",sans-serif';
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillText(t.txt,t.x,t.y+3);ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x,t.y);
  }
  ctx.globalAlpha=1;ctx.restore();

  if(banner){
    const pp=1.6-banner.t,s=pp<.18?pp/.18:1,a=banner.t<.4?banner.t/.4:1;
    ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,330);ctx.scale(s,s);ctx.rotate(-.05);
    box(ctx,'#ffc233',-200,-40,400,80,18);ctx.fillStyle='#231700';ctx.font='900 34px "Arial Black","Segoe UI",sans-serif';ctx.textAlign='center';ctx.fillText(banner.txt,0,12);ctx.restore();
  }
  if(state==='run'&&carsDone<2&&!D.best){
    ctx.globalAlpha=.75+Math.sin(time*5)*.2;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 22px "Arial Black","Segoe UI",sans-serif';
    ctx.fillText('ТАПНИ — ПРЫЖОК',W/2,H-118);ctx.fillText('ДЕРЖИ — ПРЫГНЕШЬ ВЫШЕ',W/2,H-88);ctx.globalAlpha=1;
  }
  const v=ctx.createLinearGradient(0,0,0,150);v.addColorStop(0,'rgba(0,0,0,.45)');v.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=v;ctx.fillRect(0,0,W,150);
}

/* ================= ИНТЕРФЕЙС ================= */
function hud(){
  $('coinv').textContent=readJ().coins|0;
  $('lvltxt').textContent='Вагон '+carsDone;
  $('lvlfill').style.width=Math.round((carsDone%10)/10*100)+'%';
}

/* ================= ЗВУК ================= */
let AC=null,sfxG=null,nbuf=null;
function initAudio(){
  try{
    if(AC){if(AC.state==='suspended')AC.resume();return;}
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    AC=new A();sfxG=AC.createGain();sfxG.connect(AC.destination);sfxG.gain.value=.55;
    nbuf=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function osc(t,f,d,type,v,slide){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+d+.03);}
function noise(t,d,v,fq,type){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type=type||'lowpass';f.frequency.value=fq;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(sfxG);s.start(t);s.stop(t+d+.03);}
function sfx(name){
  if(!AC||!D.snd||AC.state!=='running')return;
  try{
    const t=AC.currentTime;
    if(name==='jump'){osc(t,300,.14,'square',.14,420);}
    else if(name==='coin'){osc(t,1250,.05,'triangle',.2,0);osc(t+.05,1680,.08,'triangle',.2,0);}
    else if(name==='stomp'){osc(t,180,.12,'square',.22,-120);noise(t,.08,.3,900);}
    else if(name==='die'){osc(t,330,.45,'sawtooth',.26,-290);noise(t,.2,.4,600);}
    else if(name==='fall'){osc(t,700,.7,'sine',.22,-620);}
    else if(name==='bonus'){[523,659,784,1047].forEach((f,i)=>osc(t+i*.08,f,.16,'square',.14,0));}
    else if(name==='clack'){noise(t,.05,.16,500,'bandpass');}
    else if(name==='click'){osc(t,620,.04,'square',.12,0);}
  }catch(e){}
}

/* ================= ВВОД ================= */
function press(){
  initAudio();
  if(state==='menu'){startRun();return;}
  if(state==='run'){holding=true;pressT=time;}
}
function release(){holding=false;}
cv.addEventListener('pointerdown',ev=>{ev.preventDefault();press();});
window.addEventListener('pointerup',release);
window.addEventListener('pointercancel',release);
window.addEventListener('keydown',ev=>{if((ev.code==='Space'||ev.code==='ArrowUp')&&$('over').hidden){ev.preventDefault();if(!ev.repeat)press();}});
window.addEventListener('keyup',ev=>{if(ev.code==='Space'||ev.code==='ArrowUp')release();});
$('bSnd').addEventListener('click',()=>{initAudio();D.snd=D.snd?0:1;saveD();$('bSnd').className='mb half'+(D.snd?'':' off');sfx('click');});
$('bRetry').addEventListener('click',()=>{sfx('click');startRun();});
$('bMenu').addEventListener('click',()=>{sfx('click');showMenu();});
$('bHome').addEventListener('click',()=>{sfx('click');if(EMBED&&state==='menu'){post({type:'exit'});return;}showMenu();});
document.addEventListener('visibilitychange',()=>{if(!AC)return;try{if(document.hidden)AC.suspend();else AC.resume();}catch(e){}});

/* ================= МАСШТАБ И ЦИКЛ ================= */
function fit(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H)||1;
  $('stage').style.transform='translate(-50%,-50%) scale('+s+')';
  const r=clamp(s*(window.devicePixelRatio||1),1,3);
  cv.width=Math.round(W*r);cv.height=Math.round(H*r);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
window.addEventListener('resize',fit);
let last=0,MANUAL=false; // MANUAL — для автотестов: время двигает тест, а не requestAnimationFrame
function frame(ts){
  if(MANUAL){requestAnimationFrame(frame);return;}
  const dt=Math.min(.033,Math.max(0,(ts-last)/1000)||0);last=ts;
  update(dt);draw();requestAnimationFrame(frame);
}
fit();showMenu();requestAnimationFrame(frame);
window.__train={press,release,manual:()=>{MANUAL=true;},step:(ms,noDraw)=>{update(Math.min(.033,ms/1000));if(!noDraw)draw();},
  info:()=>({state,dist,carsDone,y:p.y,vy:p.vy,ground:p.ground,speed:speedAt(dist),coins:runCoins,reason:lastReason}),
  car:k=>carAt(k),PX,HW,ROOF};
</script>
