<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Дикое родео</title>
<style>
/* стили — как в «Меткий Джо» (public/games/joe.html), чтобы игры выглядели одной семьёй */
@@CSS@@
#title .l1.rodeo{font-size:56px;letter-spacing:6px}
#title .l2.rodeo{font-size:104px;letter-spacing:3px}
#note{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="540" height="960"></canvas>

  <div id="hud">
    <div id="hudrow">
      <button id="bHome" hidden aria-label="В меню">&#10005;</button><span></span>
      <div id="coins"><i class="coin"></i><span id="coinv">0</span></div>
    </div>
    <div id="lvl"><div id="lvlfill"></div><span id="lvltxt">Очки 0</span></div>
  </div>

  <div id="title"><div class="l1 rodeo">ДИКОЕ</div><div class="l2 rodeo">РОДЕО</div></div>
  <div id="hint">ТЯНИ НАЗАД И ОТПУСКАЙ</div>
  <div id="best"></div>
  <div id="note"></div>

  <div id="menu">
    <button id="bSnd" class="mb half" aria-label="Звук">&#9668;))</button>
  </div>

  <div id="over" hidden>
    <div class="box">
      <h2 id="ovh">РАЗБЕЖАЛИСЬ!</h2>
      <p id="ovtxt"></p>
      <button id="bChal" class="big chal" hidden>&#9876; ВЫЗОВ ДРУГУ</button>
      <button id="bRetry" class="big">ЕЩЁ РАЗ</button>
      <button id="bMenu" class="ghost">В МЕНЮ</button>
    </div>
  </div>
</div>

<script src="look.js"></script>
<script src="scenery.js"></script>
<script>
'use strict';
/* ================= БАЗА (из «Меткий Джо») ================= */
@@HELPERS@@
@@DATA@@

/* ================= СОХРАНЕНИЕ ================= */
// Монеты и скин общие с «Меткий Джо» — лежат в его сейве. Своё у игры — только рекорд и звук.
const JKEY='metkiy-joe-v1',DKEY='rodeo-v1';
const JDEF={coins:0,level:1,ownW:[0],ownS:[0],curW:0,curS:0,snd:1,mus:1,best:0};
function readJ(){try{const r=JSON.parse(localStorage.getItem(JKEY)||'null');if(r&&typeof r==='object'&&Array.isArray(r.ownW)&&Array.isArray(r.ownS))return Object.assign({},JDEF,r);}catch(e){}return Object.assign({},JDEF);}
const okId=v=>Number.isInteger(v)&&v>=0&&v<=8;
let J=readJ();
const SKIN=okId(J.curS)?J.curS:0;
function addCoins(n){if(n<=0)return;J=readJ();J.coins=(J.coins|0)+n;try{localStorage.setItem(JKEY,JSON.stringify(J));}catch(e){}}
let D={best:0,snd:1,runs:0};
try{const r=JSON.parse(localStorage.getItem(DKEY)||'null');if(r&&typeof r==='object')D=Object.assign(D,r);}catch(e){}
function saveD(){try{localStorage.setItem(DKEY,JSON.stringify(D));}catch(e){}}

/* ================= ВСТРАИВАНИЕ В «ИГРЫ ДЖО» ================= */
// ?embed=1 — открыта внутри мини-аппа; ?mode=challenge&seed=&target=&from= — вызов от друга
const QS=new URLSearchParams(location.search);
const EMBED=QS.get('embed')==='1'&&window.parent!==window;
const CH=QS.get('mode')==='challenge';
const RUN={seed:(Number(QS.get('seed'))>>>0),target:clamp(parseInt(QS.get('target'),10)||0,0,100000),from:(QS.get('from')||'').slice(0,12)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function post(m){if(EMBED)try{window.parent.postMessage(Object.assign({src:'rodeo'},m),location.origin);}catch(e){}}
// Детерминированный рандом: одинаковый сид = те же звери в то же время с той же скоростью
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rngFor(){let h=(RUN.seed^0x0DE0)|0;for(let i=0;i<arguments.length;i++){h=Math.imul(h^(arguments[i]|0),0x9E3779B1);h^=h>>>15;}return mulberry(h);}

/* ================= РИСОВАНИЕ ПЕРСОНАЖЕЙ (дословно из «Меткий Джо») ================= */
@@ART@@

/* ================= ДИКОЕ РОДЕО ================= */
// Тянешь палец назад — над головой Джо раскручивается лассо; отпускаешь — бросок по дуге.
// Видно только начало траектории, дальше — чутьё. Сбежавший зверь — минус сердце. Скунса не ловить!
const GROUND=800;                 // земля, по ней бегут звери
const SC=1.3;                     // масштаб Джо
const JX=92,JY=706;               // Джо стоит на стоге сена
const HAND={x:JX+18,y:JY-58*SC};  // откуда летит петля
const GRAV=1500;
const VMIN=250,VMAX=1260;         // скорость броска при слабом и полном натяжении (слабым можно достать зверя у самого стога)
const PULL=210;                   // столько пикселей натяжения — полная сила
const CATCH_R=34;                 // петля ловит зверя ближе этого расстояния
const ESCAPE_X=JX-36;             // зверь пробежал под Джо — сбежал
const LIVES=3,STEP=25;
const PREVIEW=.32;                // какая доля траектории видна при прицеливании

// тип: скорость, очки, размер, как бегает
const KIND={
  calf:   {pts:1,v:[105,150],w:58,h:40,hop:0},
  piglet: {pts:1,v:[130,170],w:46,h:32,hop:0},
  chicken:{pts:2,v:[190,240],w:34,h:34,hop:14},
  rabbit: {pts:3,v:[200,250],w:36,h:30,hop:70},
  gold:   {pts:5,v:[250,290],w:58,h:40,hop:0},
  skunk:  {pts:0,v:[110,150],w:48,h:32,hop:0}
};

let state='menu',critters=[],sched=[],next=0,runT=0,score=0,combo=0,bestCombo=0,lives=LIVES,caught=0,runCoins=0,lastReason='escape',deadT=0;
let lasso=null,aim=null,spin=0,throwT=0,joeKick=0;
let parts=[],texts=[],timers=[],banner=null,clouds=[];
let shake=0,time=0,flashT=0,hurtT=0;
let biome=0,prevBiome=0,biomeT=1;
let pal=[PALS[3][0].slice(),PALS[3][1].slice()];
const after=(t,fn)=>timers.push({t,fn});
const palFor=n=>PALS[(3+Math.floor(n/STEP))%PALS.length];

// Зверь i задаётся сидом и номером: когда выбежит, кто это, как быстро бежит.
function genSpawn(i){
  const g=rngFor(i,4),prev=sched[i-1];
  const gap=i===0?1.0:Math.max(.78,1.9-i*.014)*(.7+g()*.6);
  const t=(prev?prev.t:0)+gap;
  const r=g();
  let type='calf';
  if(i>=3){
    if(i>=8&&r<.12)type='skunk';
    else if(i>=14&&r<.17)type='gold';
    else if(i>=10&&r<.34)type='rabbit';
    else if(i>=5&&r<.56)type='chicken';
    else if(r<.78)type='piglet';
  }
  const K=KIND[type],sp=(K.v[0]+g()*(K.v[1]-K.v[0]))*Math.min(1.35,1+i*.004);
  sched[i]={t,type,v:sp,ph:g()*6.283};
}
function spawnAt(i){while(sched.length<=i)genSpawn(sched.length);return sched[i];}

function resetRun(){
  if(!CH)RUN.seed=(Math.random()*4294967296)>>>0;
  critters=[];sched=[];next=0;runT=0;score=0;combo=0;bestCombo=0;lives=LIVES;caught=0;runCoins=0;lastReason='escape';deadT=0;
  lasso=null;aim=null;spin=0;throwT=0;joeKick=0;parts=[];texts=[];timers=[];banner=null;clouds=[];shake=0;flashT=0;hurtT=0;
  biome=prevBiome=0;biomeT=1;
  spawnAt(6);
}
function startRun(){
  $('title').hidden=$('hint').hidden=$('best').hidden=$('menu').hidden=$('note').hidden=true;
  $('over').hidden=true;$('bHome').hidden=false;
  resetRun();state='run';hud();
}
function die(){
  if(state!=='run')return;
  state='dead';deadT=0;aim=null;
  D.runs=(D.runs|0)+1;if(score>D.best)D.best=score;saveD();
  const res={seed:RUN.seed,level:1,kills:score,coins:runCoins};
  post(Object.assign({type:'result',challenge:CH},res));
  after(1.2,()=>showOver(res));
}
function showOver(res){
  const h=$('ovh');
  if(CH){
    const d=score-RUN.target;
    h.textContent=d>0?'ПОБЕДА!':d===0?'НИЧЬЯ':'НЕ ХВАТИЛО';h.style.color=d>0?'#5cff5c':d===0?'#ffc233':'#ff4d6d';
    $('ovtxt').innerHTML='Ты: <b>'+score+'</b> · '+esc(RUN.from||'Друг')+': <b>'+RUN.target+'</b><br>Заработано монет: <b>'+runCoins+'</b>';
  }else{
    h.textContent=lastReason==='skunk'?'ФУ, СКУНС!':'РАЗБЕЖАЛИСЬ!';h.style.color='';
    $('ovtxt').innerHTML='Очки: <b>'+score+'</b> · рекорд: <b>'+D.best+'</b><br>Поймано: <b>'+caught+'</b> · лучшая серия: <b>'+bestCombo+'</b>';
  }
  const bc=$('bChal');bc.hidden=!(EMBED&&score>0);bc.innerHTML=CH?'&#9876; ОТВЕТНЫЙ ВЫЗОВ':'&#9876; ВЫЗОВ ДРУГУ';
  bc.onclick=()=>{sfx('click');post(Object.assign({type:'challenge'},res));};
  $('over').hidden=false;$('bHome').hidden=true;
}
function showMenu(){
  resetRun();state='menu';
  $('title').hidden=$('hint').hidden=$('menu').hidden=false;$('over').hidden=true;
  $('bHome').hidden=!EMBED;
  const b=$('best');b.className='';b.hidden=!D.best;b.textContent='Рекорд: '+D.best;
  if(CH){b.hidden=false;b.className='ch';b.textContent='ВЫЗОВ ОТ '+(RUN.from||'ДРУГА').toUpperCase()+': ПОБЕЙ '+RUN.target;}
  $('bSnd').className='mb half'+(D.snd?'':' off');
  hud();
}
function addCoinsRun(n,x,y){addCoins(n);runCoins+=n;addText(x,y,'+'+n,'#ffc233',22);hud();}

/* ================= ЭФФЕКТЫ ================= */
function burst(x,y,col,n,up){
  for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-220,220),vy:rnd(-360,up?-60:30),col,sz:rnd(3,7),t:0,life:rnd(.5,1.1),g:1});
  if(parts.length>360)parts.splice(0,parts.length-360);
}
function dust(x,y,n){for(let i=0;i<n;i++)parts.push({x:x+rnd(-10,10),y:y-rnd(0,6),vx:rnd(20,90),vy:rnd(-60,-10),col:'rgba(240,226,190,.75)',sz:rnd(4,8),t:0,life:rnd(.3,.55),g:.1});}
function addText(x,y,txt,col,size){texts.push({x:clamp(x,90,W-90),y,txt,col,size:size||24,t:0});}

/* ================= ЛАССО ================= */
// натяжение → скорость и угол броска (бросаем только вперёд-вверх)
function throwParams(dx,dy){
  const len=Math.hypot(dx,dy),pw=clamp(len/PULL,0,1);
  let ang=Math.atan2(-dy,dx);            // тянем назад-вниз → летит вперёд-вверх
  ang=clamp(ang,-.15,1.48);             // можно бросить «свечкой» почти вертикально
  return {v:VMIN+(VMAX-VMIN)*pw,ang,pw};
}
function beginAim(x,y){if(state!=='run'||lasso)return;aim={x0:x,y0:y,x,y};}
function moveAim(x,y){if(aim){aim.x=x;aim.y=y;}}
function endAim(){
  if(!aim)return;const a=aim;aim=null;
  const dx=a.x0-a.x,dy=a.y0-a.y;
  if(Math.hypot(dx,dy)<18||state!=='run'||lasso)return;   // слишком слабо — не бросаем
  const p=throwParams(dx,dy);
  lasso={x:HAND.x,y:HAND.y,vx:Math.cos(p.ang)*p.v,vy:-Math.sin(p.ang)*p.v,mode:'fly',t:0,rot:0,target:null};
  joeKick=1;throwT=0;sfx('throw');
}
// бросок «по параметрам» — для автотестов и демо
function throwAt(v,ang){if(state==='dead'||lasso)return;lasso={x:HAND.x,y:HAND.y,vx:Math.cos(ang)*v,vy:-Math.sin(ang)*v,mode:'fly',t:0,rot:0,target:null};joeKick=1;}
function critterY(c){return GROUND-(c.hop?Math.abs(Math.sin(c.t*(c.type==='rabbit'?4.2:9)+c.ph))*c.hop:0);}
function catchCritter(c){
  lasso.mode='pull';lasso.target=c;c.caught=true;
  if(c.type==='skunk'){
    combo=0;lives--;hurtT=.6;shake=10;sfx('stink');
    for(let i=0;i<5;i++)clouds.push({x:c.x+rnd(-30,30),y:critterY(c)-30+rnd(-20,10),r:rnd(18,30),t:0});
    addText(c.x,critterY(c)-70,'ФУ-У!','#9bd36a',30);
    if(lives<=0){lastReason='skunk';after(.4,die);}
    return;
  }
  combo++;bestCombo=Math.max(bestCombo,combo);
  const mult=Math.min(5,1+Math.floor((combo-1)/3)),gain=KIND[c.type].pts*mult;
  score+=gain;caught++;
  sfx('catch',combo);shake=Math.max(shake,4);
  addText(c.x,critterY(c)-74,combo>=3?'ЙИ-ХА! ×'+mult:'ЙИ-ХА!','#ffe066',combo>=3?28:26);
  addText(c.x,critterY(c)-44,'+'+gain,'#fff',24);
  if(c.type==='gold'){addCoinsRun(5,c.x+40,critterY(c)-90);burst(c.x,critterY(c)-20,'#ffd24a',20,true);}
  else if(combo%5===0)addCoinsRun(1,c.x+40,critterY(c)-90);
  const before=Math.floor((score-gain)/STEP);
  if(Math.floor(score/STEP)!==before){
    prevBiome=biome;biome=Math.floor(score/STEP);biomeT=0;sfx('bonus');
    banner={t:1.8,txt:score+' ОЧКОВ!',sub:'ЗВЕРИ ВСЁ БЫСТРЕЕ'};
  }
  hud();
}

/* ================= ОБНОВЛЕНИЕ ================= */
function update(dt){
  time+=dt;
  for(let i=timers.length-1;i>=0;i--){const t=timers[i];t.t-=dt;if(t.t<=0){timers.splice(i,1);t.fn();}}
  const tp=palFor(score),kk=Math.min(1,dt*1.2);pal=[mix(pal[0],tp[0],kk),mix(pal[1],tp[1],kk)];
  if(biomeT<1)biomeT=Math.min(1,biomeT+dt/1.2);
  if(flashT>0)flashT-=dt;if(hurtT>0)hurtT-=dt;if(joeKick>0)joeKick=Math.max(0,joeKick-dt*4);
  spin+=dt*(aim?10+throwParams(aim.x0-aim.x,aim.y0-aim.y).pw*14:3);

  if(state==='menu'){
    // в меню по прерии бегают звери — живая заставка
    if(critters.length<3&&Math.random()<dt*.8){const types=['calf','piglet','chicken','rabbit'],ty=types[Math.floor(Math.random()*4)];critters.push({type:ty,x:W+40,v:KIND[ty].v[0],t:0,ph:Math.random()*6,hop:KIND[ty].hop,caught:false});}
  }
  if(state==='run'){
    runT+=dt;
    while(spawnAt(next).t<=runT){const s=spawnAt(next);critters.push({type:s.type,x:W+50,v:s.v,t:0,ph:s.ph,hop:KIND[s.type].hop,caught:false,id:next});next++;}
  }
  for(let i=critters.length-1;i>=0;i--){
    const c=critters[i];c.t+=dt;
    if(c.caught)continue;
    c.x-=c.v*dt;
    if(Math.random()<dt*8)dust(c.x+KIND[c.type].w*.4,GROUND,1);
    if(c.x<ESCAPE_X){
      critters.splice(i,1);
      if(state==='run'&&c.type!=='skunk'){
        lives--;combo=0;hurtT=.5;shake=8;sfx('escape');addText(JX+60,GROUND-120,'СБЕЖАЛ!','#ff4d6d',26);
        if(lives<=0){lastReason='escape';die();}
      }
      continue;
    }
    if(c.x<-80)critters.splice(i,1);
  }
  // петля летит, ловит, тянет зверя к Джо
  if(lasso){
    const L=lasso;L.t+=dt;
    if(L.mode==='fly'){
      L.vy+=GRAV*dt;L.x+=L.vx*dt;L.y+=L.vy*dt;L.rot+=dt*12;
      if(state==='run')for(const c of critters){
        if(c.caught)continue;
        const cy=critterY(c)-KIND[c.type].h*.5;
        if(Math.hypot(L.x-c.x,L.y-cy)<CATCH_R+KIND[c.type].w*.12){catchCritter(c);break;}
      }
      if(L.mode==='fly'&&(L.y>=GROUND-4||L.x>W+60)){L.mode='miss';L.t=0;L.y=Math.min(L.y,GROUND-4);if(state==='run'){combo=0;sfx('miss');dust(L.x,GROUND,6);}}
    }else if(L.mode==='miss'){
      if(L.t>.18){const k=Math.min(1,(L.t-.18)/.35);L.x=lerp(L.x,HAND.x,k*.35);L.y=lerp(L.y,HAND.y,k*.35);}
      if(L.t>.6)lasso=null;
    }else if(L.mode==='pull'){
      const c=L.target;
      c.x-=dt*1150;L.x=c.x;L.y=critterY(c)-KIND[c.type].h*.5;
      if(Math.random()<.6)dust(c.x+20,GROUND,1);
      if(c.x<JX+40){
        const i=critters.indexOf(c);if(i>=0)critters.splice(i,1);
        burst(JX+40,GROUND-20,c.type==='skunk'?'#9bd36a':'#fff',8,true);
        lasso=null;
      }
    }
  }
  for(let i=clouds.length-1;i>=0;i--){const q=clouds[i];q.t+=dt;q.y-=12*dt;if(q.t>1.4)clouds.splice(i,1);}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.t+=dt;if(q.t>q.life){parts.splice(i,1);continue;}q.vy+=1100*q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.t+=dt;t.y-=46*dt;if(t.t>1)texts.splice(i,1);}
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  if(state==='dead')deadT+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*40);
}

/* ================= ОТРИСОВКА ================= */
function legs(x,y,col,w,t,run){
  const a=run?Math.sin(t*22)*5:0;
  box(ctx,col,x-w*.36+a,y-12,6,12,2);box(ctx,col,x-w*.16-a,y-12,6,12,2);box(ctx,col,x+w*.14+a,y-12,6,12,2);box(ctx,col,x+w*.32-a,y-12,6,12,2);
}
function drawCritter(c){
  const K=KIND[c.type],y=critterY(c),x=c.x,run=!c.caught,t=c.t,bob=run&&!c.hop?Math.abs(Math.sin(t*22))*2:0;
  const wig=c.caught?Math.sin(t*40)*.12:0;
  // тень
  ctx.globalAlpha=.25;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(x,GROUND+3,K.w*.5,6,0,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.save();ctx.translate(x,y-bob);ctx.rotate(wig);ctx.translate(-x,-(y-bob));
  const yb=y-bob;
  if(c.type==='calf'||c.type==='gold'){
    const body=c.type==='gold'?'#ffc233':'#f4f1ea',spot=c.type==='gold'?'#e09a14':'#2b2b35';
    legs(x,yb,c.type==='gold'?'#c98a10':'#d9d2c4',K.w,t,run);
    box(ctx,body,x-K.w/2+6,yb-38,K.w-6,26,12);
    box(ctx,spot,x-2,yb-36,14,10,5);box(ctx,spot,x+12,yb-26,10,8,4);
    box(ctx,body,x-K.w/2-6,yb-48,24,22,8);                       // голова
    box(ctx,'#ffb3c0',x-K.w/2-10,yb-36,12,10,5);                 // нос
    box(ctx,'#1b1b28',x-K.w/2+2,yb-43,4,4,2);
    box(ctx,'#c9a46a',x-K.w/2+2,yb-54,4,8,2);box(ctx,'#c9a46a',x-K.w/2+12,yb-54,4,8,2);   // рожки
    box(ctx,body,x+K.w/2-4,yb-38,4,14,2);                        // хвост
    if(c.type==='gold'){const s=Math.max(0,Math.sin(time*6+c.ph));ctx.globalAlpha=s;poly(ctx,'#fff',[x+6,yb-50,x+8,yb-44,x+14,yb-42,x+8,yb-40,x+6,yb-34,x+4,yb-40,x-2,yb-42,x+4,yb-44]);ctx.globalAlpha=1;}
  }else if(c.type==='piglet'){
    legs(x,yb,'#e98aa0',K.w,t,run);
    box(ctx,'#ffadc0',x-K.w/2,yb-32,K.w,22,11);
    box(ctx,'#ff94ab',x-K.w/2-6,yb-30,12,10,5);disc(ctx,'#c95f78',x-K.w/2-3,yb-25,1.6);disc(ctx,'#c95f78',x-K.w/2+2,yb-25,1.6);
    box(ctx,'#1b1b28',x-K.w/2+6,yb-28,3,3,1);poly(ctx,'#ff94ab',[x-K.w/2+8,yb-32,x-K.w/2+14,yb-40,x-K.w/2+16,yb-31]);
    ctx.strokeStyle='#ff94ab';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+K.w/2+3,yb-26,4,0,5);ctx.stroke();
  }else if(c.type==='chicken'){
    const f=Math.sin(t*30)*4;
    box(ctx,'#ffb020',x-6,yb-8,3,8);box(ctx,'#ffb020',x+3,yb-8,3,8);
    disc(ctx,'#ffffff',x,yb-20,14);box(ctx,'#ffffff',x-14,yb-36,14,16,6);
    poly(ctx,'#ffb020',[x-14,yb-30,x-22,yb-27,x-14,yb-25]);box(ctx,'#e5334b',x-12,yb-42,8,7,3);box(ctx,'#e5334b',x-14,yb-26,4,6,2);
    box(ctx,'#1b1b28',x-10,yb-32,3,3,1);poly(ctx,'#e8e8e8',[x+2,yb-22,x+16,yb-24-f,x+12,yb-14]);
  }else if(c.type==='rabbit'){
    legs(x,yb,'#a58e78',K.w,t,run&&c.hop&&Math.abs(Math.sin(c.t*4.2+c.ph))<.2);
    box(ctx,'#c8ae94',x-K.w/2+4,yb-26,K.w-4,18,9);box(ctx,'#c8ae94',x-K.w/2-4,yb-34,16,16,7);
    box(ctx,'#c8ae94',x-K.w/2,yb-54,5,22,3);box(ctx,'#c8ae94',x-K.w/2+7,yb-52,5,20,3);box(ctx,'#ffb3c0',x-K.w/2+1,yb-50,3,14,2);
    box(ctx,'#1b1b28',x-K.w/2,yb-30,3,3,1);disc(ctx,'#fff',x+K.w/2,yb-22,6);
  }else if(c.type==='skunk'){
    legs(x,yb,'#14141f',K.w,t,run);
    box(ctx,'#1d1d28',x-K.w/2,yb-30,K.w,20,10);box(ctx,'#1d1d28',x-K.w/2-8,yb-32,16,14,6);
    box(ctx,'#f4f4f4',x-K.w/2-2,yb-34,K.w-4,5,2);                // белая полоса
    // пушистый хвост вверх — узнаётся издалека
    box(ctx,'#1d1d28',x+K.w/2-10,yb-58,18,34,9);box(ctx,'#f4f4f4',x+K.w/2-4,yb-56,6,28,3);
    box(ctx,'#ffb3c0',x-K.w/2-10,yb-26,4,4,2);box(ctx,'#fff',x-K.w/2-3,yb-29,3,3,1);
  }
  ctx.restore();
}
function drawLoop(x,y,r,rot,squash){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.scale(1,squash||.45);
  ctx.strokeStyle='#8a5a2b';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();
  ctx.strokeStyle='#d9a45f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();ctx.restore();
}
function rope(x0,y0,x1,y1,sag){
  ctx.strokeStyle='#8a5a2b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo((x0+x1)/2,Math.max(y0,y1)+sag,x1,y1);ctx.stroke();
  ctx.strokeStyle='#d9a45f';ctx.lineWidth=1.5;ctx.stroke();
}
function windmill(x,y){
  const col=css(mix(pal[0],pal[1],.25));
  poly(ctx,col,[x-14,y,x+14,y,x+5,y-120,x-5,y-120]);
  ctx.save();ctx.translate(x,y-122);ctx.rotate(time*1.4);for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);box(ctx,col,-3,0,6,46,2);box(ctx,col,-7,26,14,20,2);}ctx.restore();
  disc(ctx,col,x,y-122,6);
}
function draw(){
  const sx=shake?rnd(-shake,shake):0,sy=shake?rnd(-shake,shake):0;
  const g=ctx.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,css(pal[0]));g.addColorStop(1,css(mix(pal[0],pal[1],.7)));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(sx,sy);
  const sun=css(mix(pal[1],[255,240,190],.6));ctx.globalAlpha=.18;disc(ctx,sun,W-120,250,100);ctx.globalAlpha=1;disc(ctx,sun,W-120,250,56);
  // облака
  for(let i=0;i<4;i++){const x=((time*(10+i*4)+i*170)%(W+220))-110,y=150+i*48;ctx.globalAlpha=.22;box(ctx,'#fff',x,y,110,22,11);box(ctx,'#fff',x+24,y-14,62,24,12);ctx.globalAlpha=1;}
  // холмы, мельница, амбар
  ctx.fillStyle=css(mix(pal[0],pal[1],.42));ctx.beginPath();ctx.moveTo(0,GROUND);for(let x=0;x<=W;x+=20)ctx.lineTo(x,640-Math.sin(x*.012+1)*40-Math.sin(x*.031)*14);ctx.lineTo(W,GROUND);ctx.fill();
  windmill(W-110,670);
  const bc=css(mix([190,60,50],pal[1],.25));box(ctx,bc,W-260,600,90,70,2);poly(ctx,css(mix([140,40,40],pal[1],.2)),[W-268,604,W-215,560,W-162,604]);box(ctx,'#f4f1ea',W-232,630,34,40,2);box(ctx,bc,W-228,634,26,36);
  ctx.fillStyle=css(mix(pal[0],pal[1],.58));ctx.beginPath();ctx.moveTo(0,GROUND);for(let x=0;x<=W;x+=20)ctx.lineTo(x,700-Math.sin(x*.02+3)*16);ctx.lineTo(W,GROUND);ctx.fill();
  // забор вдоль поля
  const fc=css(mix([120,80,50],pal[0],.2));for(let x=140;x<W+20;x+=60){box(ctx,fc,x,GROUND-60,8,60,2);}box(ctx,fc,130,GROUND-48,W,6,2);box(ctx,fc,130,GROUND-26,W,6,2);
  // земля: трава полосами
  const gr=css(mix([120,180,70],pal[1],.25)),gd=css(mix([90,150,55],pal[1],.25));
  box(ctx,gr,-20,GROUND,W+40,H-GROUND);for(let y=GROUND+18;y<H;y+=34)box(ctx,gd,-20,y,W+40,10);
  for(let x=-10;x<W;x+=22){const h=6+hsh(x)*8;poly(ctx,gd,[x,GROUND+1,x+5,GROUND-h,x+10,GROUND+1]);}
  // стог сена и загон
  box(ctx,'#e8c25a',JX-46,JY,92,GROUND-JY+4,14);box(ctx,'#c99a30',JX-46,JY+30,92,6);box(ctx,'#c99a30',JX-46,JY+60,92,6);
  for(let i=0;i<9;i++){const xx=JX-40+i*10;box(ctx,'#f3d77a',xx,JY-4+(i%2)*3,3,10,1);}

  for(const c of critters)drawCritter(c);

  // Джо
  const blink=hurtT>0&&Math.floor(time*20)%2===0;
  if(!blink){
    const lean=aim?-.08:joeKick*.18;
    ctx.save();ctx.translate(JX,JY);ctx.rotate(lean);drawDude(ctx,0,0,1,SC,cc=>drawJoe(cc,SKIN),-1,0,0,0);ctx.restore();
  }
  // лассо: крутится над головой (при прицеливании шире), летит, тянет
  if(state!=='dead'||lasso){
    if(!lasso&&state!=='menu'){
      const pw=aim?throwParams(aim.x0-aim.x,aim.y0-aim.y).pw:0,r=16+pw*16;
      rope(HAND.x,HAND.y,HAND.x+Math.cos(spin)*r*.3,JY-92*SC,6);
      drawLoop(HAND.x-4,JY-94*SC,r,0,.32+Math.sin(spin)*.08);
    }else if(state==='menu'&&!lasso){drawLoop(HAND.x-4,JY-94*SC,16,0,.32+Math.sin(spin)*.08);}
    if(lasso){
      const L=lasso,sag=L.mode==='fly'?20:L.mode==='pull'?0:40;
      rope(HAND.x,HAND.y,L.x,L.y,sag);
      if(L.mode==='pull')drawLoop(L.x,L.y,16,0,.5);else drawLoop(L.x,L.y,22,Math.sin(L.rot)*.2,L.mode==='miss'?.25:.45);
    }
  }
  // прицел: видна только первая часть дуги — дальше на чутьё
  if(aim&&state==='run'&&!lasso){
    const p=throwParams(aim.x0-aim.x,aim.y0-aim.y);
    let x=HAND.x,y=HAND.y,vx=Math.cos(p.ang)*p.v,vy=-Math.sin(p.ang)*p.v;
    let tt=0;const T=2*p.v*Math.max(.2,Math.sin(p.ang)+.25)/GRAV*PREVIEW;
    for(let i=0;i<14;i++){const dt=T/14;vy+=GRAV*dt;x+=vx*dt;y+=vy*dt;tt+=dt;ctx.globalAlpha=(1-i/14)*.9;disc(ctx,'#fff',x,y,5-i*.22);}
    ctx.globalAlpha=1;
    // шкала силы
    box(ctx,'rgba(0,0,0,.35)',JX-40,JY+18,80,10,5);box(ctx,p.pw>.95?'#ff4d6d':'#ffe066',JX-40,JY+18,80*p.pw,10,5);
  }
  for(const q of clouds){ctx.globalAlpha=Math.max(0,1-q.t/1.4)*.75;disc(ctx,'#9bd36a',q.x,q.y,q.r+q.t*10);ctx.globalAlpha=1;}
  for(const q of parts){ctx.globalAlpha=clamp((q.life-q.t)*2,0,1);ctx.fillStyle=q.col;ctx.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz);}
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const t of texts){
    const a=t.t<.7?1:1-(t.t-.7)/.3,sc=t.t<.12?.6+t.t/.12*.4:1;
    ctx.globalAlpha=Math.max(0,a);ctx.font='900 '+Math.round(t.size*sc)+'px "Arial Black","Segoe UI",sans-serif';
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillText(t.txt,t.x,t.y+3);ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x,t.y);
  }
  ctx.globalAlpha=1;ctx.restore();

  if(state!=='menu'&&!window.__video)for(let i=0;i<LIVES;i++){
    const x=36+i*36,y=166,on=i<lives;ctx.globalAlpha=on?1:.25;
    disc(ctx,'#ff4d6d',x-6,y-3,8);disc(ctx,'#ff4d6d',x+6,y-3,8);poly(ctx,'#ff4d6d',[x-13,y,x+13,y,x,y+14]);ctx.globalAlpha=1;
  }
  if(state==='run'&&combo>=3){ctx.textAlign='center';ctx.font='900 22px "Arial Black",sans-serif';const m=Math.min(5,1+Math.floor((combo-1)/3));ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillText('СЕРИЯ '+combo+' · ОЧКИ ×'+m,W/2+2,153);ctx.fillStyle='#ffe066';ctx.fillText('СЕРИЯ '+combo+' · ОЧКИ ×'+m,W/2,150);}
  if(banner){
    const full=1.8,pp=full-banner.t,s=pp<.18?pp/.18:1,a=banner.t<.4?banner.t/.4:1;
    ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,300);ctx.scale(s,s);ctx.rotate(-.05);
    box(ctx,'#ffc233',-210,-40,420,96,18);ctx.fillStyle='#231700';ctx.textAlign='center';
    ctx.font='900 32px "Arial Black","Segoe UI",sans-serif';ctx.fillText(banner.txt,0,4);ctx.font='900 16px "Arial Black","Segoe UI",sans-serif';ctx.fillText(banner.sub,0,36);
    ctx.restore();
  }
  if(state==='run'&&(D.runs|0)<2&&runT<7){
    ctx.globalAlpha=.8+Math.sin(time*5)*.15;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 20px "Arial Black","Segoe UI",sans-serif';
    ctx.fillText('ТЯНИ ПАЛЕЦ НАЗАД — ОТПУСКАЙ',W/2,H-90);ctx.font='900 16px "Arial Black","Segoe UI",sans-serif';ctx.fillStyle='#d6ff9a';ctx.fillText('СКУНСА (С ПОЛОСКОЙ) НЕ ЛОВИ!',W/2,H-60);ctx.globalAlpha=1;
  }
  const vg=ctx.createRadialGradient(W/2,H*.5,H*.36,W/2,H*.5,H*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.3)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  const v=ctx.createLinearGradient(0,0,0,150);v.addColorStop(0,'rgba(0,0,0,.4)');v.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=v;ctx.fillRect(0,0,W,150);
}

/* ================= ИНТЕРФЕЙС ================= */
function hud(){
  $('coinv').textContent=readJ().coins|0;
  $('lvltxt').textContent='Очки '+score;
  $('lvlfill').style.width=Math.round((score%STEP)/STEP*100)+'%';
}

/* ================= ЗВУК ================= */
let AC=null,sfxG=null,nbuf=null;
function initAudio(){
  try{
    if(AC){if(AC.state==='suspended')AC.resume();return;}
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    AC=new A();sfxG=AC.createGain();sfxG.connect(AC.destination);sfxG.gain.value=.55;
    nbuf=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function osc(t,f,d,type,v,slide){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+d+.03);}
function noise(t,d,v,fq,type){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type=type||'lowpass';f.frequency.value=fq;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(sfxG);s.start(t);s.stop(t+d+.03);}
function sfx(name,a){
  if(!AC||!D.snd||AC.state!=='running')return;
  try{
    const t=AC.currentTime;a=a|0;
    if(name==='throw'){noise(t,.25,.25,1800,'bandpass');osc(t,300,.2,'triangle',.1,300);}
    else if(name==='catch'){const f=520*Math.pow(1.09,Math.min(a,10));osc(t,f,.08,'square',.13,0);osc(t+.08,f*1.33,.08,'square',.13,0);osc(t+.16,f*1.66,.14,'square',.13,0);}
    else if(name==='miss'){noise(t,.12,.25,500);}
    else if(name==='escape'){osc(t,400,.25,'sawtooth',.16,-220);}
    else if(name==='stink'){osc(t,140,.5,'sawtooth',.18,-60);noise(t,.4,.3,300);}
    else if(name==='bonus'){[523,659,784,1047].forEach((f,i)=>osc(t+i*.08,f,.16,'square',.14,0));}
    else if(name==='click'){osc(t,620,.04,'square',.12,0);}
  }catch(e){}
}

/* ================= ВВОД ================= */
// Палец в любом месте → тяни назад (влево-вниз) → отпускай. Направление и сила — как у рогатки.
function toGame(ev){const r=cv.getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',ev=>{ev.preventDefault();initAudio();if(state==='menu'){startRun();return;}const p=toGame(ev);beginAim(p.x,p.y);});
cv.addEventListener('pointermove',ev=>{if(!aim)return;const p=toGame(ev);moveAim(p.x,p.y);});
window.addEventListener('pointerup',()=>endAim());
window.addEventListener('pointercancel',()=>{aim=null;});
window.addEventListener('keydown',ev=>{if(!$('over').hidden)return;if((ev.code==='Space'||ev.code==='Enter')&&state==='menu'){ev.preventDefault();initAudio();startRun();}});
$('bSnd').addEventListener('click',()=>{initAudio();D.snd=D.snd?0:1;saveD();$('bSnd').className='mb half'+(D.snd?'':' off');sfx('click');});
$('bRetry').addEventListener('click',()=>{sfx('click');startRun();});
$('bMenu').addEventListener('click',()=>{sfx('click');showMenu();});
$('bHome').addEventListener('click',()=>{sfx('click');if(EMBED&&state==='menu'){post({type:'exit'});return;}showMenu();});
document.addEventListener('visibilitychange',()=>{if(!AC)return;try{if(document.hidden)AC.suspend();else AC.resume();}catch(e){}});

/* ================= МАСШТАБ И ЦИКЛ ================= */
function fit(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H)||1;
  $('stage').style.transform='translate(-50%,-50%) scale('+s+')';$('stage').style.visibility='visible';
  const r=clamp(s*(window.devicePixelRatio||1),1,2);
  cv.width=Math.round(W*r);cv.height=Math.round(H*r);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
window.addEventListener('resize',fit);
let last=0,MANUAL=false; // MANUAL — для автотестов: время двигает тест, а не requestAnimationFrame
function frame(ts){
  if(MANUAL){requestAnimationFrame(frame);return;}
  const dt=Math.min(.033,Math.max(0,(ts-last)/1000)||0);last=ts;
  update(dt);draw();requestAnimationFrame(frame);
}
fit();showMenu();requestAnimationFrame(frame);
window.__rodeo={start:startRun,throwAt,manual:()=>{MANUAL=true;},step:(ms,noDraw)=>{update(Math.min(.033,ms/1000));if(!noDraw)draw();},
  aim:(x0,y0,x,y)=>{beginAim(x0,y0);moveAim(x,y);},release:endAim,
  info:()=>({state,score,combo,lives,caught,runT,busy:!!lasso,critters:critters.filter(c=>!c.caught).map(c=>({type:c.type,x:c.x,y:critterY(c),v:c.v,hop:c.hop,t:c.t,ph:c.ph,h:KIND[c.type].h}))}),
  // для роликов: начать с k-го зверя (в клипе звери разнообразнее, чем в первых секундах забега)
  skipTo:k=>{spawnAt(k+8);next=k;critters=[];runT=sched[k].t-.4;},
  HAND,GRAV,GROUND,VMIN,VMAX,CATCH_R};
</script>
